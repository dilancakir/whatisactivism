      gender: m
      gender_provenece: inferred
  year: 2022.0
  quote: >
    Der Siegeszug des Aktivismus ist mittlerweile so weit fortgeschritten, dass
    er vom Kapitalismus vereinnahmt wird
  bibliographical_info: "p. 9"
- id: quote_16
  GND: 1154414639
