  quote: >
    This volume takes “activism” to be the most recent evolution of what has
    always constituted politics as seen from the perspective of the politically dominated.
  bibliographical_info: 'p. 9'
- id: quote_69
  GND:
   - 1104737027
   - 1068475269
   - 1346938016
  WikiID: .nan
  country: Switzerland
