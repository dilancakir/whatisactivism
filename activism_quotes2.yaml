  bibliographical_info: 'Trüper, Henning: Aktivismus und Kulturgeschichte des Moralischen.
    In: ZfL BLOG (blog), 21. November 2023. https://www.zflprojekte.de/zfl-blog/2023/11/21/henning-trueper-aktivismus-und-kulturgeschichte-des-moralischen/.'
  country: Germany
  zotero_key: DZEYA7FG 
  id: quote_28
  language: German
  person:
   - name: Trüper, Henning
     gender: m
  quote: „Meist wird als Aktivismus die emphatische Teilnahme an sozialen Bewegungen
    emanzipatorischer Art bezeichnet. Es geht dabei häufig um marginalisierte Gruppen
    und Anliegen. For­derungen nach Ermächtigung und Gleichberechtigung sowie die
    Herausstellung besonderer Schutzbedürftigkeit stehen im Zentrum.“
  year: 2023.0
- GND: 106006510X
  WikiID: Q113824055
  bibliographical_info: 'Trüper, Henning: Aktivismus und Kulturgeschichte des Moralischen.
    In: ZfL BLOG (blog), 21. November 2023. https://www.zflprojekte.de/zfl-blog/2023/11/21/henning-trueper-aktivismus-und-kulturgeschichte-des-moralischen/.'
  country: Germany
  zotero_key: DZEYA7FG
  id: quote_29
  language: German
  person:
   - name: Trüper, Henning
     gender: m
  quote: '„›Aktivismus‹  wird heute kontextabhängig in vielen Bedeutungen verwendet:
