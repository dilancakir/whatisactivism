  - name: Shakil Gröppmaier, Sakina
    gender: w
  year: 2024.0
  quote: Activists are communicators and writing is the practice with which they most
    clearly and concisely communicate their intentions and demands.
  bibliographical_info: 'p. 11'
- id: quote_72
