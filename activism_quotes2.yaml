  quote: >
    […] die Geschichte des Aktivismus beginnt in Deutschland vor rund hundert
    Jahren – mit Leuten wie dem späteren Friedensnobelpreisträger <a href="https://www.wikidata.org/wiki/Q76358" target="_blank">Carl von Ossietzky</a>
    oder dem heute nahezu vergessenen <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>,
    die den Begriff »Aktivismus« in Umlauf brachten.
  bibliographical_info: "p. 2"
