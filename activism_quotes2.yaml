  bibliografical info: 'Lepper, Marcel, Julia Encke, und Volker Weiß: Stellung beziehen?
    Zum journalistischen und wissenschaftlichen Umgang mit der Neuen Rechten. Ein
    Podiumsgespräch mit Marcel Lepper und Volker Weiß, moderiert von Julia Encke.
    In: Deutsche Vierteljahrsschrift für Literaturwissenschaft und Geistesgeschichte
    98, Nr. 4 (1. Dezember 2024): 727–737. https://doi.org/10.1007/s41245-024-00263-8.'
  country: Germany
  gender: m
  id: quote_72
  language: German
  name: Weiß, Volker
  quote: '"Und noch einmal zurück zur Frage nach Journalismus und Aktivismus: Wenn
    wir die Medien der anderen Seite anschauen, sind das durchgehend aktivistische
    Medien, ohne Ausnahme. Der Anspruch, keine Haltung zu haben, neutral zu sein,
    nicht aktiv zu sein – der wird komischerweise immer nur an uns herangetragen.
    Werfen Sie mal einen Blick in die Junge Freiheit – das ist eine komplett aktivistische
    Zeitung. Kurz gesagt: Ich bin der Meinung, eine gute Berichterstattung braucht
    eine Haltung."'
  year: 2024.0
- GND: .nan
  WikiID: .nan
  bibliografical info: 'Lepper, Marcel, Julia Encke, und Volker Weiß: Stellung beziehen?
