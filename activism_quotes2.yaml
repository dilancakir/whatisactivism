  quote: >
    'Und noch einmal zurück zur Frage nach Journalismus und Aktivismus: Wenn
    wir die Medien der anderen Seite anschauen, sind das durchgehend aktivistische
    Medien, ohne Ausnahme. Der Anspruch, keine Haltung zu haben, neutral zu sein,
    nicht aktiv zu sein – der wird komischerweise immer nur an uns herangetragen.
    Werfen Sie mal einen Blick in die Junge Freiheit – das ist eine komplett aktivistische
    Zeitung. Kurz gesagt: Ich bin der Meinung, eine gute Berichterstattung braucht
    eine Haltung.'
  bibliographical_info: 'p. 732'
