   - name: Kim, David D.
     gender: m
     gender_provenece: inferred
  year: 2022.0
  quote: >
    Wohl kaum ein anderer Roman der deutschsprachigen Gegenwartsliteratur hat ein doppeldeutigeres Bild der vielfach verzwickten Relation zwischen Kritik 
    und Aktivismus gezeichnet als <a href="https://www.wikidata.org/wiki/Q85361" target="_blank">Jenny Erpenbecks</a> »Gehen, ging, gegangen« (2015). 
    […] Am Ende der Geschichte bedient er sich kaum mehr seines 
    literaturwissenschaftlichen Werkzeugkastens und scheint vielmehr ein Aktivist geworden zu sein. Der Grund dafür ist klar: Nachdem die 
    Leser*innen Richards politische Bekehrung über Hunderte Seiten lang mühsam miterlebt haben, sollen auch sie ihm nacheifern anstatt in der 
    literarischen Imagination gefangen zu bleiben.
  bibliographical_info: 'p.431'
- id: quote_82
  GND:
   - 1227623070
  WikiID:
   - Q133848474
  country: USA
  zotero_key: 6VQG5FAK
  language: German
  person:
   - name: Kim, David D.
     gender: m
     gender_provenece: inferred
  year: 2022.0
  quote: >
    Zugleich möchte ich klarstellen, dass die Frustration, die Hoffnung, die Widerstandsfähigkeit, die Wissensfreiheit, 
    die Freude und auch die existentielle Angst, die künstlerisch-wissenschaftlich-aktivistische Zusammenarbeiten neuerdings motivieren, 
    sich <a href="https://www.wikidata.org/wiki/Q22670" target="_blank">Schillers</a> Hochmut und teleologischer Entwicklungsnarrative 
    der Menschheit dezidiert widersetzen.
  bibliographical_info: 'p. 434'
- id: quote_83
  GND:
   - 1227623070
  WikiID:
   - Q133848474
  country: USA
  zotero_key: 6VQG5FAK
  language: German
  person:
   - name: Kim, David D.
     gender: m
     gender_provenece: inferred
  year: 2022.0
  quote: >
    Von manchen Literaturwissenschaftler*innen wird jegliche Form von literaturwissenschaftlichem Aktivismus nicht nur deswegen abgelehnt, 
    weil sie droht, ihre vermeintlich wertfreien, objektiv wissenschaftlichen Erkenntnisse mit ideologisch verzerrten Urteilen zu korrumpieren, 
    sondern auch weil eine kritische Überprüfung fachwissenschaftlicher Forschungen aufgrund außeruniversitärer Wissensformen ihr soziales Privileg, 
    wenn nicht »ihr ganzes Daseyn«, in Frage stellt.
  bibliographical_info: 'p. 433'
