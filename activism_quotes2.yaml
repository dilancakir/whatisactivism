      gender: m
      gender_provenece: inferred
  year: 2004.0
  quote: >
    Aktivismus, der: (zu aktiv= handelnd, tätig; Begriff erstmals im Umkreis der »Jahrbücher für tätigen Geist« Das Ziel [1916-24]) Bez. für Programm einer 
    »literatur-ethischen« Richtung zwischen 1910 u. 1925, die sich auf <a href="https://www.wikidata.org/wiki/Q76480" target="_blank">Heinrich Manns</a> Forderung berief, 
    daß »Geist und Tat« eins sein sollten, u. für Politisierung 
    der Literatur eintrat; begr. von <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>, 
    der »Eth« gegen Ästhet, »Gedichtschreiber« gegen polit. Engagierten stellt; von relativ geringer Wirkung, 
    wohl wegen inneren Widerspruchs, da der Kunstwert von Dichtung sich in dem Maße verringert, wie ihr Gebrauchswert 
    erhöht werden soll; wird im allg. als Gegenströmung zum Expressionismus gesehen, die dessen vorwiegend ästhet. Ausdrucksart die polit.-soziale Gesinnung entgegenhält.
  bibliographical_info: "p. 20"
