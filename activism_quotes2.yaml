  quote: "Begriff [Aktivismus], der nach dem Ersten Weltkrieg zu einer Modevokabel insbesondere linker politischer Intellektueller geworden war."
  bibliographical_info: 'p. 16'
- id: quote_76
  GND: 1024169928
  WikiID: Q95265865
  country: Germany
  zotero_key: NQ4NG26R
  language: German
  person:
    - name: Sina, Kai
      gender: m
  year: 2024
  quote: |
    Vielmehr eröffnet die Rede ein Spektrum an Merkmalen und Eigenschaften,
    das <person>[Thomas] Manns</person> Aktivismus seit den mittleren
    Zwanzigerjahren in unterschiedliche Akzentuierungen und Facetten prägt.
    Eingedenk dieser Einschränkungen meint 'aktivistisch' erstens, dass es einen
    konkreten Anlass für das politische Einschreiten gibt (im beispielhaften Fall die
    Reichstagswahl vom September 1930 mit dem alarmierenden Stimmenzuwachs der NSDAP);
    dass Thomas Mann zweitens auf einen für ihn ansonsten ungewöhnlich handfesten Ton,
    teils auf Polemik zurückgreift (etwa wenn er den Nationalsozialisten einen politischen
    'Groteskstil mit Heilsarmee-Allüren, Massenkrampf, Budengeläut' bescheinigt);
    dass er drittens auf der Grundlage einer klaren moralischen Unterscheidung argumentiert
    (eine Verletzung des 'Menschenanstands' erkennt er im politischen Rechtsruck); und
    dass er viertens zielgerichtet vorgeht, also wirksamen Einfluss auf den Prozess der
    öffentlichen Meinungsbildung nehmen will (was ja bereits durch die Gattungszuordnung
    seiner Rede 'Appell' deutlich gemacht wird).
  bibliographical_info: 'p. 18'
- id: quote_77
  GND: 1272448207
  WikiID: Q126594474
  country: Germany
  zotero_key: G8YPYK2E
  language: German
  person:
    - name: Çakir, Dîlan Canan
      gender: f
  year: 2024
  quote: |
    Aktivistische Handlungen und Literatur sind selbstverständlich älter als der Wortgebrauch von Aktivismus,
    der verstärkt im frühen 20. Jahrhundert auftaucht. Als Aktivismus wird in der Regel unabhängig von
    bestimmten Inhalten das aktive Handeln begriffen. Diesem Handeln wird nicht selten die Theorie entgegengehalten,
    die sich gegensätzlich zum Handeln verhalte. Gleichwohl gilt besonders den Intellektuellen und damit
    auch Autor*innen das Denken und Theoretisieren nicht unbedingt als Gegensatz zum Aktivismus, sondern
    als eine Form desselben, unter anderem deshalb, weil sie ihre Theorien zu einer »aktive[n] gesellschaftliche[n]
    Führungsfunktion« anleiten soll.
  bibliographical_info: 'p. 351'
