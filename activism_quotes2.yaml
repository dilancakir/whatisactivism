  gender: m/w
  id: quote_71
  language: English
  name: Monot, Pierre-Héli, David Bebnowski, und Sakina Shakil Gröppmaier
  quote: '"Activists are communicators and writing is the practice with which they
    most clearly and concisely communicate their intentions and demands."'
  year: 2024.0
