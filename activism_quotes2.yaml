  language: German
  person:
    - name: Lützenkirchen, Harald
      gender: m
      gender_provenece: inferred
  year: 2001.0
  quote: >
    Dies war mehr als Expressionismus, dies war Aktivismus. <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a> 
    und seine Schriftsteilerkollegen 
    <a href="https://www.wikidata.org/wiki/Q2173136" target="_blank">Rudolf Kayser</a>
     und <a href="https://www.wikidata.org/wiki/Q2646151" target="_blank">Alfred Wolfenstein</a> 
     ersannen dieses Schlagwort im Herbst 1914, kurz vor Ausbruch des 1. 
    Weltkriegs. <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller</a> 
    selbst definierte den Unterschied dergestalt, daß er den Expressionismus als eine Ausdrucksart 
    empfand, den Aktivismus hingegen als eine Gesinnung, wobei beides in einer Person zusammenfallen konnte.
  bibliographical_info: 'p. 25'
