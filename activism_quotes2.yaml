      gender: m
      gender_provenece: inferred
  year: 1969.0
  quote: >
    Als ‚Aktivismus‘ bezeichnet <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>
    Ende 1914 eine radikale geistige Bewegung innerhalb der expressionistischen Autorengeneration. 
    Bereits in  den letzten Vorkriegsjahren entstanden, gewann sie unter dem Eindruck der apokalyptischen
    Schrecken des ‚Großen Krieges‘ ihre äußerste Entschiedenheit.
  bibliographical_info: "Klappentext"
- id: quote_7
  GND: 118590391
  WikiID: Q76358
  country: Germany
  zotero_key: C7NHECS6
  language: German
  person:
    - name: Ossietzky, Carl von
      gender: m
      gender_provenece: inferred
  year: 1918.0
  quote: >
    Seit Jahresfrist oder - ich weiß wirklich nicht wie lange - durchzuckt die
    deutschte Öffentlichkeit das Schlagwort Aktivismus, begierig aufgegriffen von
    der literarischen Jugend. Was haben wir in dem Worte zu suchen? Sehnsucht nach
    Taten, Wille zu wirken, Tagespolitik mit geistiger Kraft zu durchsetzen, Abkehr
    von intellektuellem Chinesentume. Das Losungswort einer neuen Jugend also. Einer
    Jugend, die geistig sein möchte und doch nicht isoliert. Die heraus möchte aus
    dem Dunstkreise des Studierzimmers, der ästhetischen Koterie. Wenn das ein Zeichen
    unserer Zeit ist, dann ist es gewiß kein schlechtes.
  bibliographical_info: "p."
- id: quote_8
  GND: 118590391
