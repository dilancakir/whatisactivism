  person:
  - name: Cordsen, Knut
    gender: m
    gender_provenece: inferred
  year: 2022.0
  quote: >
    '[…] die Geschichte des Aktivismus beginnt in Deutschland vor rund hundert
    Jahren – mit Leuten wie dem späteren Friedensnobelpreisträger <a href="https://www.wikidata.org/wiki/Q76358" target="_blank">Carl von Ossietzky</a>
    oder dem heute nahezu vergessenen <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>,
    die den Begriff »Aktivismus« in Umlauf brachten.'
  bibliographical_info: '(last accessed 30.10.2023).'
- id: quote_2
  GND: 104398352X
  WikiID: Q19959231
  country: Germany
  zotero_key: 5GVZA22Z
  language: German
  person:
  - name: Czollek, Max
    gender: m
    gender_provenece: inferred
  year: 2023.0
  quote: >
    Aktivismus ohne Denken ist orientierungslos. Aber Denken ohne Aktivismus
    wirkungslos.
  bibliographical_info: '(last accessed 31.10.2023)'
- id: quote_3
  GND: 118609807
  WikiID: Q44331
