  language: German
  person:
    - name: Schütt, Rüdiger
      gender: m
      gender_provenece: inferred
  year: 2009.0
  quote: >
    Während die breite Öffentlichkeit die Finisten ignorierte oder belächelte [...],
    nahm <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller</a> 
    sie ernst und begann eine instensive Debatte über Aktivismus/Finismus,
    auf hohem intellektuellem Niveau. Indem <a href="https://www.wikidata.org/wiki/Q1483939" target="_blank">Riegel</a> 
    und <a href="https://www.wikidata.org/wiki/Q67921" target="_blank">Rühmkorf</a> 
    ihren Standpunkt immer wieder verteidigen mussten, wurde in Abgrenzung zum 
    <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller'schen</a> Aktivismus ihre Philosophie überhaupt erst konkret.
  bibliographical_info: "pp. 19-20"
