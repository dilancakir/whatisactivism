  year: 2011.0
  quote: >
    Während seiner Berliner Zeit ab 1910 machte <a href="https://www.wikidata.org/wiki/Q126904501" target="_blank">Wegner</a> Bekanntschaft mit den Aktivisten um 
    <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>,
    die von der erneuernden Kraft des Geistes überzeugt waren und die Welt durch politisches Engagement
    der Dichter einer radikalen Veränderung unterziehen wollten.
    Diese Ziele entsprachen <a href="https://www.wikidata.org/wiki/Q126904501" target="_blank">Wegners</a> Aufbruchsstimmung, sein idealistischer Humanismus
    formierte sich unter dem Einfluss des Neukantismus, der im Kreis der aktivistischen Literaten dominierte.
  bibliographical_info: 'p. 42'
