  person:
  - name: Schnitzler, Arthur
    gender: m
    gender_provenece: inferred
  year: 1918.0
  quote: >
    Aktivisten Wirrköpferei
  bibliographical_info: 'p. 186.'
- id: quote_4
  GND: 1118875141
  WikiID: .nan
  country: Germany
  zotero_key: NKYYY89B
  language: German
  person:
  - name: Ommert, Alexandra
    gender: f
    gender_provenece: inferred
  year: 2016.0
  quote: >
    Aktivismus ist ebenfalls ein passender Begriff, um das Phänomen zu beschreiben,
    dass Aktivist_innen sich temporär zusammenfinden, um ein konkretes Projekt gemeinsam
    zu verfolgen oder eine Aktion zu planen.
  bibliographical_info: 'p. 42.'
- id: quote_5
  GND: 1118875141
  WikiID: .nan
  country: Germany
  zotero_key: NKYYY89B
  language: German
  person:
  - name: Ommert, Alexandra
    gender: f
    gender_provenece: inferred
  year: 2016.0
  quote: >
    Ich möchte Aktivismus mit Bezug auf Elke Zobl als rhizomatisches Netzwerk
    (vgl. Zobl 2012) verstehen, das aus einer Vielzahl von Knotenpunkten besteht.
  bibliographical_info: 'p. 47'
- id: quote_6
  GND: 1118875141
  WikiID: .nan
  country: Germany
  zotero_key: NKYYY89B
  language: German
  person:
  - name: Ommert, Alexandra
    gender: f
    gender_provenece: inferred
  year: 2016.0
  quote: >
    In der deutschsprachigen Literatur setzt  sich die Bezeichnung Aktivismus
    langsam durch. Als wissenschaftlicher Begriff ist Aktivismus jedoch wenig theoretisch
    diskutiert und bestimmt.
  bibliographical_info: 'p. 41'
- id: quote_7
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    '[…] a project thaht might be characterized as activist in the sense that
    it activates us to reimagine how culture might be a useful tool for societal equity.'
  bibliographical_info: 'p. 22.'
- id: quote_8
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: > 
    '[…] activism does share a certain traits with populism: it must be agile,
    fast, and responsive, and promt people to action.'
  bibliographical_info: 'p. 17.'
- id: quote_9
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    '[…] to help people who are oppressed an discriminated against qualifies
    as a form – and one definition of – activism […].'
  bibliographical_info: 'p. 24.'
- id: quote_10
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    Activism makes a demand. It is not content to remain just activism. Activism
    wants to become something other than activism; it seeks to transform ideas, politics,
    society, life.
  bibliographical_info: 'p. 23.'
- id: quote_11
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    Activism, let’s admit, is a form of branding too.
  bibliographical_info: 'p. 17.'
- id: quote_12
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    'Although maybe this is one way to think about any kind of activism: as an
    act of abandoning self-interest, even if only temporarily in the interest of others.'
  bibliographical_info: 'p. 17.'
- id: quote_13
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    And we shouldn’t forget that there is just as much right-wing ‚activism‘
    as there is progressive activism
  bibliographical_info: 'p. 27.'
- id: quote_14
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    But was I engaging in curatorial activism, or rather just trying to be a
    decent human being? Most likley it was the latter.
  bibliographical_info: 'p. 22.'
- id: quote_15
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    Does not art, writing, or curating that defines itself as activist dream
    of influencing the conditions of realpolitik? For art activism to be useful, it
    must become, in a sense, a form of realpolitik […], even as it performs resistance
    to realpolitik.
  bibliographical_info: 'p. 23.'
- id: quote_16
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    I’m not suggesting that one must be utterly selfless to engage in activism,
    because it’s not possible for humans to be completely selfless. And art is not
    a profession for the selfless.
  bibliographical_info: 'p. 20.'
- id: quote_17
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    Is curating the best way to do activism? Sometimes yes, sometimes no, and
    sometimes it’s just unclear.
  bibliographical_info: 'p. 28.'
- id: quote_18
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    It is easier to talk the talk of activism than to walk the walk of activism.
  bibliographical_info: 'p. 17.'
- id: quote_19
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: > 
    Just voting for the better candidate can be a form of activism.
  bibliographical_info: 'p. 19.'
- id: quote_20
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
  - name: Decter, Joshua
    gender: m
    gender_provenece: inferred
  year: 2019.0
  quote: >
    Pragmatically speaking, all forms of activism are an outgrowth of, or reaction
    to, mainstream politics; a shadow of the dominant modes of political organization,
    not a seperate sphere of politics.
  bibliographical_info: 'p. 23.'
- id: quote_21
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    '[…]das Zusammenspiel von Empowerment und subversiver Sprache führt somit
    dazu, dass afrodeutsche Gegenwartslyrik zu einer Form des literarischen Aktivismus
    wird.'
  bibliographical_info: 'p. 536'
- id: quote_22
  GND: 130236950
  WikiID: Q38946888
  country: Germany
  zotero_key: NIMNMCYJ
  language: German
  person:
  - name: Pester, Nora
    gender: f
    gender_provenece: inferred
  year: 2023.0
  quote: >
    'Begreift sich ein Verlag, der auf seiner Homepage von ''jüdischer Selbstermächtigung
    und Selbstverteidigung'' spricht, als aktivistisch? Pester gibt eine ambivalente
    Antwort: ''Wir sind keine Aktivisten.'
  bibliographical_info: .nan
- id: quote_23
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    Afrodeutsche Lyrik als Ausdruck von Widerstand und Aktivismus steht in einer
    literarischen Tradition, die eng mit der Schwarzen Frauenbewegung in Deutschland
    verknüpft ist und sich gegen ein gesellschaftliches Schweigen richtet.
  bibliographical_info: 'p. 539.'
- id: quote_24
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    <a href="https://www.wikidata.org/wiki/Q106655" target="_blank">May Ayim</a>
    […] prägte wie kaum eine andere die afrodeutschen Literaturen wie
    auch den Aktivismus. Ayims literarisches Schaffen sowie ihr Aktivismus für die
    Schwarze Community in Deutschland verbindet eine intersektionale Perspektive,
    die Mehrfachdiskriminierungen benennt und institutionellen Rassismus in Deutschland
    als koloniale Kontinuität in einen globalen Kontext einordnet. Die Schwarze Frauenbewegung
    in Deutschland war durch Ayim und andere Aktivistinnen somit stark lyrisch geprägt
    und auch heute noch zeigen sich in Hinblick auf Widerstandsästhetiken, Aktivismus
    und Empowerment Verbindungen zu lyrischen Texten Schwarzer Dichterinnen der Gegenwart.
  bibliographical_info: 'p. 540.'
- id: quote_25
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    <a href="https://www.wikidata.org/wiki/Q463319" target="_blank">Lorde</a>
    plädiert daher für eine 'Transformation des Schweigens in Sprache und
    Handlung' und macht die enge Verknüpfung von Sprache und Aktivismus sichtbar.
  bibliographical_info: 'p. 541.'
- id: quote_26
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    Der subversive Sprachgebrauch führt dazu, dass die Gedichte selbst zu einer
    Form des literarischen Aktivismus werden, der gesellschaftliche Veränderungen
    möglich macht.
  bibliographical_info: 'p. 542.'
- id: quote_27
  GND: 1340139073
  WikiID: Q133815075
  country: Germany
  zotero_key: W4WXC258
  language: German
  person:
  - name: Oholi, Jeannette
    gender: f
    gender_provenece: inferred
  year: 2022.0
  quote: >
    'Dadurch können die lyrischen Texte als literarischer Aktivismus gelesen
    werden: Die Schwarzen Stimmen bemächtigen sich ihrer eigenen Sprache und leisten
    Widerstand, indem sie neue Räume schaffen und sich darin zu vielschichtigen Subjekten
    entwickeln.'
  bibliographical_info: 'p. 552.'
- id: quote_28
  GND: 106006510X
  WikiID: Q113824055
  country: Germany
  zotero_key: DZEYA7FG
  language: German
  person:
  - name: Trüper, Henning
    gender: m
    gender_provenece: inferred
  year: 2023.0
  quote: >
    Meist wird als Aktivismus die emphatische Teilnahme an sozialen Bewegungen
    emanzipatorischer Art bezeichnet. Es geht dabei häufig um marginalisierte Gruppen
    und Anliegen. For­derungen nach Ermächtigung und Gleichberechtigung sowie die
    Herausstellung besonderer Schutzbedürftigkeit stehen im Zentrum.
  bibliographical_info: .nan
- id: quote_29
  GND: 106006510X
  WikiID: Q113824055
  country: Germany
  zotero_key: DZEYA7FG
  language: German
  person:
  - name: Trüper, Henning
    gender: m
    gender_provenece: inferred
  year: 2023.0
  quote: >
    '›Aktivismus‹  wird heute kontextabhängig in vielen Bedeutungen verwendet:
    als deskrip­tive Bestimmung, positiver Identifikationsbegriff, Begriff der polemischen
    Abwertung oder Zielscheibe jargonkritischen Spotts.'
  bibliographical_info: .nan
- id: quote_30
  GND: 106006510X
  WikiID: Q113824055
  country: Germany
  zotero_key: DZEYA7FG
  language: German
  person:
  - name: Trüper, Henning
    gender: m
    gender_provenece: inferred
  year: 2023.0
  quote: >
    Bedeutungskonstituierende Kriterien für ›Aktivismus‹ wären demnach erstens
    politische Partizipation jenseits einer bloß passiven, handlungsfernen Zustimmung
    oder Ablehnung sowie zweitens das Vorhandensein eines kollektiven Handlungsmusters,
    das im Hinblick auf Rechte und deren Beschränkungen lesbar ist. Der Begriff setzt
    drittens ein Grundverständnis von Asymmetrien innerhalb der politischen Partizipation
    voraus. Damit fallen aus dem gewöhnlichen Verständnis von Aktivismus solche Formen
    von politischen Bewegungen heraus, in denen es nur um Pseudomarginalisierungen
    und den Schutz bestehender Privilegien geht. Wenn man etwa auf die Frage antworten
    will, ob Aktivismus zum Beispiel von (neo-)faschistischen Bewegungen ausgeübt
    werden könne, lässt sich darauf verweisen, dass dort die elementaren Merkmale
    Ermächtigung, Gleichberechtigung, Schutzbedürftigkeit nicht oder nur in verzerrter
    Form auftreten, insofern es vornehmlich um Bemächtigung, Entrechtung und Schädigung
    anderer geht.
  bibliographical_info: .nan
- id: quote_31
  GND: 118551132
  WikiID: Q66458
  country: Germany
  zotero_key: B6SXD4JK
  language: German
  person:
  - name: Hiller, Kurt
    gender: m
    gender_provenece: inferred
  year: 1961.0
  quote: >
    Expressionist <a href="https://www.wikidata.org/wiki/Q57277" target="_blank">Benn</a>
    war nicht nur kein Aktivist, er war ein leidenschaftlicher Feind des Aktivismus.
  bibliographical_info: 'p. 189.'
- id: quote_32
  GND: 454546416
  WikiID: .nan
  country: Germany
  zotero_key: PJNXKZAN
  language: German
  person:
  - name: Rothe, Wolfgang
    gender: m
    gender_provenece: inferred
  year: 1969.0
  quote: >
    Als ‚Aktivismus‘ bezeichnet <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a>
    Ende 1914 eine radikale geistige Bewegung innerhalb der expressionistischen Autorengeneration. 
    Bereits in  den letzten Vorkriegsjahren entstanden, gewann sie unter dem Eindruck der apokalyptischen
    Schrecken des ‚Großen Krieges‘ ihre äußerste Entschiedenheit.
  bibliographical_info: 'Klappentext.'
- id: quote_33
  GND: 454546416
  WikiID: .nan
  country: Germany
  zotero_key: PJNXKZAN
  language: German
  person:
  - name: Rothe, Wolfgang
    gender: m
    gender_provenece: inferred
  year: 1969.0
  quote: >
    ganz zu schweigen von <a href="https://www.wikidata.org/wiki/Q76480" target="_blank">Heinrich Mann</a>
    , dem Erzvater des ‘Aktivismus’, dessen Essay ‘Geist und Tat’ - 1910 in der ‘Neuen Rundschau’ - 
    als eine Art Initialzündung gelten darf (<a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller</a>
    eröffnet sein erstes Jahrbuch mit dem Nachdruck dieses Textes).
  bibliographical_info: 'p. 7.'
- id: quote_34
  GND: 454546416
  WikiID: .nan
  country: Germany
  zotero_key: PJNXKZAN
  language: German
  person:
  - name: Rothe, Wolfgang
    gender: m
    gender_provenece: inferred
  year: 1969.0
  quote: >
    Tat - das Schlüsselwort des Aktivismus!
  bibliographical_info: 'p. 10.'
- id: quote_35
  GND: 454546416
  WikiID: .nan
  country: Germany
  zotero_key: PJNXKZAN
  language: German
  person:
  - name: Rothe, Wolfgang
    gender: m
    gender_provenece: inferred
  year: 1969.0
  quote: >
    Der Begriff Aktivismus täuscht eine Geschlossenheit und Einheitlichkeit vor,
    welche die Sache selber nie besessen hat.
  bibliographical_info: 'p. 12.'
- id: quote_36
  GND: 454546416
  WikiID: .nan
  country: Germany
  zotero_key: PJNXKZAN
  language: German
  person:
  - name: Rothe, Wolfgang
    gender: m
    gender_provenece: inferred
  year: 1969.0
  quote: >
    Terminologisch sauberer wäre es, statt von Aktivisten von Aktiven, Handelnden
    zu reden [...].
  bibliographical_info: 'p. 12.'
- id: quote_37
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
    gender_provenece: inferred
  year: 2022.0
