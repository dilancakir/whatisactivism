      gender: m
      gender_provenece: inferred
  year: 2025.0
  quote: >
    Academic activism challenges the notion that academics should adopt a detached and supposedly ‘neutral’ and ‘objective’ stance towards social realities. It rejects the idea that academics should solely study and analyse these realities without actively driving or implementing change in the world. It posits, instead, that academics bear an advantage – if not a responsibility – to employ their knowledge and expertise in non-academic projects that aim to improve life and society. Academic activism encompasses more than just the question of neutrality. One must not necessarily subscribe to sociologist <a href="https://www.wikidata.org/wiki/Q9387" target="_blank">Max Weber's</a> neutrality in scholarship or pedagogy.
  bibliographical_info: "p. 74"
