  year: 2022.0
  quote: >
    Schon von <a href="https://www.wikidata.org/wiki/Q868" target="_blank">Aristoteles</a>
     hat uns <a href="https://www.wikidata.org/wiki/38193" target="_blank">Arthur Schopenhauer</a> den Satz überliefert:
    »Das Leben besteht in der Bewegung und hat sein Wesen in ihr.« Bräuchte der
    Aktivismus einen Leitsatz, hier wäre er.
  bibliographical_info: "p. 17"
- id: quote_24
