  person:
   - name: Şahin, Reyhan   
     gender: f
     gender_provenece: inferred
  year: 2025.0
  quote: >
    Damals kannte ich Aktivismus oder politische Konzeptkunst nicht. 
    Ich habe es einfach aus meiner Identität heraus gemacht. Mir waren zwar die politischen, feministischen, 
    antirassistischen Absichten wichtig, aber ich konnte es nicht benennen. Auch Provokation hat bei meiner Ausdrucksform eine 
    Rolle gespielt. Aber die Reaktionen haben mir gezeigt: Das hat nicht nur irritiert, sondern richtig Hass ausgelöst. Totale Polarisierung.
  bibliographical_info: '(last accessed 22.04.2025)'
