  language: German
  person:
    - name: Cordsen, Knut
      gender: m
      gender_provenece: inferred
  year: 2022.0
  quote: >
    Doch der Status des Aktivisten hat sich in den vergangenen hundert Jahren
    fundamental verändert. Er ist von der Randfigur zur bestimmenden Sozialfigur geworden.
    [...] der zeitgenössische Aktivist [nimmt] eine zentrale Stellung innerhalb der
    Gesellschaft ein.
  bibliographical_info: "p. 12"
- id: quote_15
