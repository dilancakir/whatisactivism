  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: Darüber hinaus begleitet den Aktivismus seit seinem Beginn der Verdacht des
    'Scheinaktivismus', wie das der hellsichtige Georg Lukás schon 1934 nannte. Der
    Scheinaktivismus unserer Tage heißt 'Slacktivism'.
  bibliographical_info: 'p. 13.'
