  WikiID: Q37030
  country: Germany
  zotero_key: RRE6YS5R
  language: German
  person:
    - name: Mann, Thomas
      gender: m
      gender_provenece: inferred
  year: 1922.0
  quote: >
    Unterdessen liegt es ja auf der Hand, daß, was sich in Deutschland »Aktivismus«
    nennt, nichts ist als die Übertragung eines bestimmten Kunstgeschmacks und -temperaments
    ins Politische. Eine Kunstschule (»Expressionismus«) von heftig aktivischen Bedürfnissen,
    der Ruhe, der Betrachtung, dem epischen Behagen, der Sachlichkeit und Heiterkeit
    verächtlich abgeneigt, ganz auf das Rapide, Vehement-Bewegte, Graß-Ausdrucksvolle
    gestellt, - verlangt eines Tages, daß »der Geistige« handle. Das könnte gut werden.
    Was mich betrifft, so denke ich mit Interesse und Dankbarkeit für wertvolle, im 
    <a href="https://www.wikidata.org/wiki/Q5879"target="_blank">Goetheschen</a> Sinn
    »bedeutende« Eindrücke der knallenden Wut, Grausamkeit, Wildbuntheit, Härte, 
    Unheiterkeit, Unerbittlichkeit, Bösartigkeit, Inhumanität, mit der gewissen
    neueste Geschichte erzählt sind, und ich sage mir: Ob die politische Lehrmeinung
    dieser Herren Kollegen nun pazifistisch ist oder nicht, tut wenig zur Sache, - hier
    ist der Krieg! Sie sangen ihn in jeder Zeile, bevor er da war, und nie gab es
    ein besseres Beispiel dafür, wie wenig das Meinen das Sein verkündigt.
  bibliographical_info: "p. 192"
