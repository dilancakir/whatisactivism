  quote: >
    [<a href="https://www.wikidata.org/wiki/Q106613" target="_blank">Christian Geissler</a>] gewann Kontakte zur Friedensbewegung, zu den Verfolgten des Nationalsozialismus 
    und auch in die DDR. All dies trug dazu bei, dass er sich neben der künstlerischen Arbeit zum politischen 
    Aktivisten und in seiner Analyse der gesellschaftlichen Verhältnisse zum Marxisten entwickelte. In einem 
    Gespräch mit Pieter Bassen resümiert <a href="https://www.wikidata.org/wiki/Q106613" target="_blank">Christian Geissler</a> 
    gut vierzig Jahre später: »Wenn man über das Moralische des Antifaschismus hinauswill in einen anwendbaren Antifaschismus, 
    kommt man auf <a href="https://www.wikidata.org/wiki/Q9061" target="_blank">Marx</a>.«
