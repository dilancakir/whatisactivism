  language: German
  person:
    - name: Ommert, Alexandra
      gender: f
      gender_provenece: inferred
  year: 2016.0
  quote: >
    Aktivismus ist ebenfalls ein passender Begriff, um das Phänomen zu beschreiben,
    dass Aktivist_innen sich temporär zusammenfinden, um ein konkretes Projekt gemeinsam
    zu verfolgen oder eine Aktion zu planen.
  bibliographical_info: "p. 42"
- id: quote_85
  GND: 1118875141
  WikiID: .nan
  country: Germany
  zotero_key: NKYYY89B
  language: German
  person:
    - name: Ommert, Alexandra
      gender: f
      gender_provenece: inferred
  year: 2016.0
  quote: >
    Ich möchte Aktivismus mit Bezug auf Elke Zobl als rhizomatisches Netzwerk
    (vgl. Zobl 2012) verstehen, das aus einer Vielzahl von Knotenpunkten besteht.
  bibliographical_info: "p. 47"
- id: quote_86
  GND: 1118875141
  WikiID: .nan
  country: Germany
  zotero_key: NKYYY89B
  language: German
  person:
    - name: Ommert, Alexandra
      gender: f
      gender_provenece: inferred
  year: 2016.0
  quote: >
    In der deutschsprachigen Literatur setzt sich die Bezeichnung Aktivismus
    langsam durch. Als wissenschaftlicher Begriff ist Aktivismus jedoch wenig theoretisch
    diskutiert und bestimmt.
  bibliographical_info: "p. 41"
- id: quote_87
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    […] activism does share a certain traits with populism: it must be agile,
    fast, and responsive, and promt people to action.
  bibliographical_info: "p. 17"
- id: quote_88
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    […] to help people who are oppressed an discriminated against qualifies
    as a form – and one definition of – activism […].
  bibliographical_info: "p. 24"
- id: quote_89
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Activism makes a demand. It is not content to remain just activism. Activism
    wants to become something other than activism; it seeks to transform ideas, politics,
    society, life.
  bibliographical_info: "p. 23"
- id: quote_90
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Activism, let’s admit, is a form of branding too.
  bibliographical_info: "p. 17"
- id: quote_91
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Although maybe this is one way to think about any kind of activism: as an
    act of abandoning self-interest, even if only temporarily in the interest of others.
  bibliographical_info: "p. 17"
- id: quote_92
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    And we shouldn’t forget that there is just as much right-wing ›activism‹
    as there is progressive activism
  bibliographical_info: "p. 27"
- id: quote_93
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    But was I engaging in curatorial activism, or rather just trying to be a
    decent human being? Most likley it was the latter.
  bibliographical_info: "p. 22"
- id: quote_94
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Does not art, writing, or curating that defines itself as activist dream
    of influencing the conditions of realpolitik? For art activism to be useful, it
    must become, in a sense, a form of realpolitik […], even as it performs resistance
    to realpolitik.
  bibliographical_info: "p. 23"
- id: quote_95
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    I’m not suggesting that one must be utterly selfless to engage in activism,
    because it’s not possible for humans to be completely selfless. And art is not
    a profession for the selfless.
  bibliographical_info: "p. 20"
- id: quote_96
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Is curating the best way to do activism? Sometimes yes, sometimes no, and
    sometimes it’s just unclear.
  bibliographical_info: "p. 28"
- id: quote_97
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    It is easier to talk the talk of activism than to walk the walk of activism.
  bibliographical_info: "p. 17"
- id: quote_98
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Just voting for the better candidate can be a form of activism.
  bibliographical_info: "p. 19"
- id: quote_99
  GND: 1057278327
  WikiID: .nan
  country: USA
  zotero_key: EZBLC4RE
  language: English
  person:
    - name: Decter, Joshua
      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    Pragmatically speaking, all forms of activism are an outgrowth of, or reaction
    to, mainstream politics; a shadow of the dominant modes of political organization,
    not a seperate sphere of politics.
  bibliographical_info: "p. 23"
- id: quote_100
  GND: 128533587
  WikiID: Q503815
  country: USA
  zotero_key: YI2MXGFL
  language: English
  person:
    - name: McKibben, Bill
      gender: m
      gender_provenece: inferred
  year: 2025.0
  quote: >
    But it's worth pointing out how odd it is that we even need climate activism.
    After all, key to the story of global warming is that it came with a timely warning.
  bibliographical_info: "foreword"
