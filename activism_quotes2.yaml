  quote: >
    Der Aktivismus ist ein manifester Bestandteil unserer Gesellschaft geworden.
    Er ist aus ihr gar nicht mehr wegzudenken. Paradoxerweise aber ist er selbst nichts,
    was auf Dauer gestellt sein kann. Denn seine Daseinsberechtigung erlischt, wenn
    er erreicht hat, wofür er gestritten hat.
  bibliographical_info: "p. 21"
