  quote: >
    Auf dieses eigenständige Aktivwerden von Wissenschaftler*innen bezieht sich der Begriff des 
    scientific political activism. [...] In einem so breit verstandenen Sinn beschränkt sich scientific 
    political activism nicht auf ein Engagement von Wissenschaftler*innen in sozialen Bewegungen [...] 
    oder auf alternative Formen der Wissensproduktion, wie sie etwa im zeitgenössischen Begriff des „Gegenwissens“ 
    zusammengefasst wurden (siehe insbesondere die Special Section in diesem Heft). Vielmehr fokussiert der Begriff 
    auf unterschiedlichste Formen der gesellschaftspolitischen Intervention von Wissenschaftler*innen, innerhalb 
    und außerhalb von politischen Strömungen, in herrschaftskritischer wie in herrschaftsstabilisierender Absicht, 
    in Verbindung mit grassroots movements oder aus einer Establishment-Perspektive. Charakteristisch für den 
    wissenschaftlichen politischen Aktivismus ist die Art und Weise, wie er gesellschaftspolitische Wirkungen zu entfalten sucht, 
    nämlich unter Berufung auf wissenschaftliche Autorität sowie unter Einsatz von wissenschaftlichen Erkenntnissen, Theorien, Konzepten und Techniken.
  bibliographical_info: "p. 437"
