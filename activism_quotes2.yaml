  language: German
  person:
  - name: Mann, Thomas
    gender: m
  year: .nan
  quote: Unterdessen liegt es ja auf der Hand, daß, was sich in Deutschland 'Aktivismus'
    nennt, nichts ist als die Übertragung eines bestimmten Kunstgeschmacks und -temperaments
    in Politische. Eine Kunstschule ['Expressionismus'] von heftig aktivischen Bedürfnissen,
    der Ruhe, der Betrachtung, dem epischen Behagen, der Sachlichkeit und Heiterkeit
    verächtlich abgeneigt, ganz auf das Rapide, Vehement-Bewegte, Graß-Ausdrucksvolle
    gestellt, - verlangt eines Tages, daß 'die Geistige handle'.
  bibliographical_info: .nan
