      gender: m
      gender_provenece: inferred
  year: 2019.0
  quote: >
    […] a project thaht might be characterized as activist in the sense that
    it activates us to reimagine how culture might be a useful tool for societal equity.
  bibliographical_info: "p. 22"
- id: quote_84
  GND: 1118875141
  WikiID: .nan
  country: Germany
