    Darüber hinaus begleitet den Aktivismus seit seinem Beginn der Verdacht des
    ›Scheinaktivismus‹, wie das der hellsichtige <a href="https://www.wikidata.org/wiki/Q151523" target="_blank">Georg Lukács</a>
    schon 1934 nannte. Der Scheinaktivismus unserer Tage heißt ›Slacktivism‹.
  bibliographical_info: "p. 13"
