      gender: m
      gender_provenece: inferred
  year: 2025.0
  quote: >
    Although a diverse and rather disconnected literature is emerging, spanning sociology, geography, management studies, and pedagogy, scholar-activism remains underexplored in empirically and theoretically well-grounded studies. While the increasing use of terms like scholar-activism, academic activism or researcher activism signals the rise of a novel phenomenon, the debate about the politics-science connection is far from new. Since the 1920s, the relationship between intellectuals and political interests or movements has drawn the attention of social scientists across various disciplines
  bibliographical_info: "p. 2"
