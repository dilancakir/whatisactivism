  quote: >
    This essay argues that <a href="https://www.wikidata.org/wiki/Q106655" target="_blank">Ayim</a> used her outrage about discrimination in and 
    beyond Germany to shape her writing, diasporic identity, and activism. Her 
    international engagements and organizational commitments enabled her 
    to demand equality for individuals of color and to cultivate kinships with 
    Afro-diasporic women such as Guadeloupean-born author <a href="https://www.wikidata.org/wiki/Maryse Condé" target="_blank">Maryse Condé</a> 
    and <a href="https://www.wikidata.org/wiki/Q106655" target="_blank">Ayim’s</a> 
    mentor, Caribbean American poet <a href="https://www.wikidata.org/wiki/Q463319" target="_blank">Audre Lorde</a>. These bonds 
    offered a sense of belonging and emotional connection and served as forms 
    of cultural survival in a society that simultaneously rejected and ignored 
    Afro-Germanness. Foregrounding <a href="https://www.wikidata.org/wiki/Q106655" target="_blank">Ayim’s</a> global activism, I contend that it 
    encouraged her to develop a transnational Afro-diasporic paradigm, provided 
    her with a platform from which she achieved recognition for herself 
    and Afro-Germans, and allowed her to be attuned to what Lorde termed 'connected differences.'
  bibliographical_info: "p. 75"
