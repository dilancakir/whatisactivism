    - name: Aras, Maryam
      gender: f
      gender_provenece: inferred
  year: 2025.0
  quote: >
    Mein Vater würde nie von Aktivismus sprechen. Oder denken. 
    Wenn ich das Wort durch seine Augen lese, klingt es nach einem Hobby.
    Politisch aktiv sein, politisch denken, ein politisch denkender Mensch sein,
    ja. Im Grunde genommen bedeutet das für ihn Menschsein. [...] Ich selbst finde nichts Falsch 
    daran, den Begriff Aktivismus positiv zu besetzen, dem Rechtsruck, den wir gerade erleben,
    entgegen.
  bibliographical_info: "p. 13"
- id: quote_14
