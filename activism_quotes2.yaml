  year: 2024.0
  quote: >
    Aktivistische Handlungen und Literatur sind selbstverständlich älter als der Wortgebrauch von Aktivismus,
    der verstärkt im frühen 20. Jahrhundert auftaucht. Als Aktivismus wird in der Regel unabhängig von
    bestimmten Inhalten das aktive Handeln begriffen. Diesem Handeln wird nicht selten die Theorie entgegengehalten,
    die sich gegensätzlich zum Handeln verhalte. Gleichwohl gilt besonders den Intellektuellen und damit
    auch Autor*innen das Denken und Theoretisieren nicht unbedingt als Gegensatz zum Aktivismus, sondern
    als eine Form desselben, unter anderem deshalb, weil sie ihre Theorien zu einer »aktive[n] gesellschaftliche[n]
    Führungsfunktion« anleiten soll.
  bibliographical_info: "p. 351"
