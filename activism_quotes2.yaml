      gender: m
      gender_provenece: inferred
  year: 2007.0
  quote: >
    Aktivismus, m., intellektuell-politische Bewegung, die parallel zum lit. Expressionismus und im Ggs. zu ihm 
    die Lit. als Mittel zum Zweck, den Literaten als ›Verwirklicher‹ betont. Obwohl es auch einen ›rechten‹ A. 
    gab (vgl. Rothe), versteht man unter ,A., v.a. die in den fünf Jahrbüchern »Das Ziel« (1916-24, hg. v. 
    <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">K. Hiller</a>) vertretenen sozialrevolutionären, pazifistischen Thesen 
    und Programme. Als Aktivisten im engeren Sinne gelten <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">K. Hiller</a> 
    (Initiator des »Bundes zum Ziel«, 1917) und <a href="https://www.wikidata.org/wiki/Q1874926" target="_blank">L. Rubiner</a> (Aktionskreis); 
    im weiteren Sinne zählen zum A. Mitarbeiter der »Ziel«-Jahrbücher wie <a href="https://www.wikidata.org/wiki/Q70396" target="_blank">A. Kerr</a>, 
    <a href="https://www.wikidata.org/wiki/Q28480" target="_blank">M. Brod</a>, 
    <a href="https://www.wikidata.org/wiki/Q61078" target="_blank">W. Benjamin</a>, 
    <a href="https://www.wikidata.org/wiki/Q70113" target="_blank">H. Blüher</a>, 
    <a href="https://www.wikidata.org/wiki/Q215925" target="_blank">R. Leonhard</a> 
    und <a href="https://www.wikidata.org/wiki/Q90437" target="_blank">G. Wyneken</a>. 
    Blütezeit des A. waren die Jahre 1915-20. Von Einfluss war u.a. <a href="https://www.wikidata.org/wiki/Q9358" target="_blank">Nietzsche</a>, 
    programmatische Bedeutung hatte <a href="https://www.wikidata.org/wiki/Q76480" target="_blank">H. Manns</a> 
    Essay »Geist und Tat« (1910), dessen Titel in bezeichnenden Variationen aufgegriffen wird, z.B. als »Geist und Praxis(»tätiger Geist«, »Literat und Tat« 
    (<a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller</a>). 1918 wurde ein (erfolgloser)
    »Politischer Rat geistiger Arbeiter« gegründet. Das Ende des A. zeichnete sich ab mit der Selbstbeschränkung auf eine nur noch »kulturpolitische Bewegung« 
    (Aktivisten-Kongress 1919, Berlin); lediglich <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Hiller</a> blieb in zahlreichen Schriften dem erklärten 
    »Ziel« einer konkreten Utopie des durch den Literaten befreiten Menschen in einer veränderten Welt treu.
  bibliographical_info: "p. 10"
- id: quote_66
