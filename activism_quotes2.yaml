  year: 2024.0
  quote: >
    Vielmehr eröffnet die Rede ein Spektrum an Merkmalen und Eigenschaften,
    das <a href="https://www.wikidata.org/wiki/Q37030" target="_blank">[Thomas] Manns</a>
    Aktivismus seit den mittleren Zwanzigerjahren in unterschiedliche Akzentuierungen und Facetten prägt.
    Eingedenk dieser Einschränkungen meint ›aktivistisch‹ erstens, dass es einen
    konkreten Anlass für das politische Einschreiten gibt (im beispielhaften Fall die
    Reichstagswahl vom September 1930 mit dem alarmierenden Stimmenzuwachs der NSDAP);
    dass <a href="https://www.wikidata.org/wiki/Q37030" target="_blank">Thomas Mann</a> 
    zweitens auf einen für ihn ansonsten ungewöhnlich handfesten Ton,
    teils auf Polemik zurückgreift (etwa wenn er den Nationalsozialisten einen politischen
    ›Groteskstil mit Heilsarmee-Allüren, Massenkrampf, Budengeläut‹ bescheinigt);
    dass er drittens auf der Grundlage einer klaren moralischen Unterscheidung argumentiert
    (eine Verletzung des ›Menschenanstands‹ erkennt er im politischen Rechtsruck); und
    dass er viertens zielgerichtet vorgeht, also wirksamen Einfluss auf den Prozess der
    öffentlichen Meinungsbildung nehmen will (was ja bereits durch die Gattungszuordnung
    seiner Rede ›Appell‹ deutlich gemacht wird).
  bibliographical_info: "p. 18"
