  country: Germany
  gender: m
  id: quote_44
  language: German
  name: Cordsen, Knut
  quote: '"Die ''Aktivisti'', wie sich gerne selbst bezeichnen, verfügen nicht allein
    über ein enormes aufmerksamkeitsökonomisches Kapital, sie sind die Bewusstseinsgroßindustriellen
    unserer Tage. Dem philosophischen Zeitdiagnostiker Peter Sloterdijk mag derlei
    schon 2001 gedämmert haben. Er ließ damals mit der Bemerkung aufhorchen: ''Man
    könne sagen, eine Weltära der überwiegenden Seinspassivität geht zu Ende und eine
    Ära des Aktivismus beginnt...'' Diese Ära, die man mit dem in Aktivistenkreisen
    weitverbreiteten Pathos umstandslos eine ''Weltära'' taufen kann, währt indessen
    schon viel länger als gemeinhin angenommen. Über hundert Jahre schon, und es spricht
    vieles dafür, dass der Aktivismus eine deutsche Wortprägung und Idee ist."'
  year: 2022.0
- GND: 118590391
  WikiID: Q76358
  bibliografical info: 'Ossietzky, Carl von: Ein Wort über Aktivismus. In: Sämtliche
    Schriften. Ed. by. Werner Boldt. Reinbek bei Hamburg 1994, p.'
  country: Germany
  gender: m
  id: quote_45
  language: German
  name: Ossietzky, Carl von
  quote: '"Seit Jahresfrist oder - ich weiß wirklich nicht wie lange - durchzuckt
    die deutschte Öffentlichkeit das Schlagwort Aktivismus, begierig aufgegriffen
    von der literarischen Jugend. Was haben wir in dem Worte zu suchen? Sehnsucht
    nach Taten, Wille zu wirken, Tagespolitik mit geistiger Kraft zu durchsetzen,
    Abkehr von intellektuellem Chinesentume. Das Losungswort einer neuen Jugend also.
    Einer Jugend, die geisitig sein möchte und doch nicht isoliert. Die heraus möchte
    aus dem Dunstkreise des Studierzimmers, der ästhetischen Koterie. Wenn das ein
    Zeichen unserer Zeit ist, dann ist es gewiß kein schlechtes."'
  year: 1918.0
- GND: 118590391
