    Aktivisten demonstrieren, mobilisieren, emotionalisieren auf allen ihnen
    zur Verfügung stehenden Kanälen.
  bibliographical_info: 'p. 1.'
- id: quote_38
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
    gender_provenece: inferred
  year: 2022.0
