  bibliographical_info: 'Monot, Pierre-Héli, David Bebnowski, und Sakina Shakil Gröppmaier:
    „Introduction“. In: Activist Writing: History, Politics, Rhetoric, von Sakina
    Shakil Gröppmaier, 15–24. herausgegeben von Pierre-Héli Monot und David Bebnowski.
    Mono 02. Zürich: intercom Verlag, 2024. https://doi.org/10.5281/zenodo.10953093.,
    here p. 11'
  country: Switzerland
  zotero_key: MVY6Y7N3
  id: quote_69
  language: English
  person:
   - name: Monot, Pierre-Héli
    gender: m
  - name: Bebnowski, David
    gender: m
  - name: Shakil Gröppmaier, Sakina
    gender: f
  quote: '"First of all, “activist writing” is a stand-in category. It refers to an
    array of literary forms and social practices that political, protest-driven, non-institutional
    agents use to further their causes. This approach, which emphasizes the agency
    of person, has largely become unfashionable in scholarship on political change
    and activism."'
  year: 2024.0
- GND: .nan
  WikiID: .nan
  bibliographical_info: 'Monot, Pierre-Héli, David Bebnowski, und Sakina Shakil Gröppmaier:
    „Introduction“. In: Activist Writing: History, Politics, Rhetoric, von Sakina
    Shakil Gröppmaier, 15–24. herausgegeben von Pierre-Héli Monot und David Bebnowski.
    Mono 02. Zürich: intercom Verlag, 2024. https://doi.org/10.5281/zenodo.10953093.,
    here p. 11'
  country: Switzerland
  zotero_key: MVY6Y7N3
  id: quote_70
  language: English
  person:
   - name: Monot, Pierre-Héli
    gender: m
  - name: Bebnowski, David
    gender: m
  - name: Shakil Gröppmaier, Sakina
    gender: f
  quote: '"Thus, activist writing is a deliberate puncturing of the fabric of institutionalized
    politics and social life. It is an effort to demand change, to reclaim ground
    and steer into unknown but auspicious territory. It is the space where political
    agency seeks to undo political paralysis. Studying activist writing offers an
    opportunity to observe the moment when power is challenged"'
  year: 2024.0
