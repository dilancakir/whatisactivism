  person:
  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: Walter Benjamin, alles andere als ein Reaktionär, sprach 1932 vom 'Irrtum
    des Aktivismus'.
  bibliographical_info: 'p. 16.'
- id: quote_50
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: 'Schon von Aristoteles hat uns Arthur Schopenhauer den Satz überliefert:
    ''Das Leben besteht in der Bewegung und hat sein Wesen in ihr.'' Bräuchte der
    Aktivismus einen Leitsatz, hier wäre er.'
  bibliographical_info: 'p. 17.'
- id: quote_51
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: Der Aktivismus ist ein manifester Bestandteil unserer Gesellschaft geworden.
    Er ist aus ihr gar nicht mehr wegzudenken. Paradoxerweise aber ist er selbst nichts,
    was auf Dauer gestellt sein kann. Denn seine Daseinsberechtigung erlischt, wenn
    er erreicht hat, wofür er gestritten hat.
  bibliographical_info: 'p. 21.'
- id: quote_52
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: Dieser apokalyptische Gestus, dieser endzeitliche Zug ist dem Aktivismus
    seit Anbeginn eingeschrieben.
  bibliographical_info: 'p. 24.'
- id: quote_53
  GND: 1154414639
  WikiID: Q50521652
  country: Germany
  zotero_key: 2BCNJ29A
  language: German
  person:
  - name: Cordsen, Knut
    gender: m
  year: 2022.0
  quote: Der Aktivist tritt seit frühesten Tagen als Rigorist*in und Wahrheitsmonopolist*in
    auf. [...] Die ersten Aktivisten haben ganz offen von sich als den 'Aristoi' hesprochen
    und damit klar zu verstehen gegeben, dass sie sich für 'die Besten' hielten. [...]
    Die relative Humorferne des Aktivismus ist so alt wie seine Geschichte.
  bibliographical_info: 'p. 25.'
