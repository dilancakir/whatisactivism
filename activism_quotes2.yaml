  GND:
   - .nan
  WikiID:
   - Q90118815
  country: Sweden
  zotero_key: 54HVQBDP
  language: English
  person:
   - name: Özkula, Suay Melisa
     gender: f
     gender_provenece: inferred
  year: 2021.0
  quote: >
    In  broad  terms,  digital  activism  (D.A.)  refers  to  political  activism  on  the 
    internet  or  political  movements  relying  on  it.  
  bibliographical_info: 'p. 61'
- id: quote_88
  GND:
   - .nan
  WikiID:
   - Q90118815
  country: Sweden
  zotero_key: 54HVQBDP
  language: English
  person:
   - name: Özkula, Suay Melisa
     gender: f
     gender_provenece: inferred
  year: 2021.0
  quote: >
     Consequently, the terms clicktivism and slacktivism have been used derogatorily to describe a phlegmatic form of digitally enabled 
     activism  that  is  rooted  in  low  commitment  [...]],  or,  in Shulman’s  [...]]  words, »low-quality,  
     redundant,  and  generally insubstantial commenting by the public«. As such, digital activism remains a contentious 
     subject and somewhat obscure with regards to its scope and societal effects, issues that inform its conceptualization. 
     Following that premise, this paper will argue that digital activism is a 
     hazy and, as such, immanently problematic, if not dysfunctional, concept. 
     This  dysfunctionality  arises  from  it  typically  being  defined  as  digitally enabled  activism,  suggesting  
     that  digitality  is  a  key  paradigm  change  in newer forms of activism.
  bibliographical_info: 'p. 61'
- id: quote_89
  GND:
   - 173148026
  WikiID:
   - Q12338523
  country: Germany
  zotero_key: XC7DWY7Y
  language: German
  person:
   - name: Klausen, Søren Harnow 
     gender: m
     gender_provenece: inferred
  year: 2014.0
  quote: >
     Der Aktivismus ist eine gleichermaßen anziehende und herausfordernde Gedankenfigur. Die Idee, das authentische Menschenleben zeichne sich
     durch aktives, kompromissloses Handeln und tätige Selbstverwirklichung aus, fand in der europäischen Philosophie und Literatur zwischen 1800
     und 1950 viele prägnante Ausdrücke, erfuhr aber auch stets Kritik und Modifikationen. [...] Der Aktivismus war eine weit verbreitete 
     Geisteshaltung, die eine Vielzahl verschiedener Quellen aufwies und auch von Denkern und Autoren unabhängig voneinander entwickelt und vertreten wurde.
  bibliographical_info: 'p. 374'
- id: quote_90
  GND:
   - 173148026
  WikiID:
   - Q12338523
  country: Germany
  zotero_key: XC7DWY7Y
  language: German
  person:
   - name: Klausen, Søren Harnow 
     gender: m
     gender_provenece: inferred
  year: 2014.0
  quote: >
     Wie weit verbreitet aktivistisches Gedankengut in Nordeuropa gegen Ende des 19. Jahrhunderts war, und wie vielfältig seine Quellen 
     und Weiterentwicklungen waren, zeigt z.B. die Tatsache, dass selbst <a href="https://www.wikidata.org/wiki/Q703531" target="_blank">Harald Høffding</a>
     , der sonst als Widersacher von Brandes und <a href="https://www.wikidata.org/wiki/Q9358" target="_blank">Nietzsche</a> bekannt ist (und dessen Philosophie 
     auch in Deutschland Wirkung ausübte) und als gemäßigter »Empirist« gilt, auch den Willen und noch allgemeiner die Wirksamkeit 
     als psychologische und erkenntnistheoretische Grundphänomene begriff, wenngleich ohne radikale moralische Konsequenzen daraus zu ziehen.
  bibliographical_info: 'p. 375'
- id: quote_91
  GND:
   - .nan
  WikiID:
   - .nan
  country: Germany
  zotero_key: IHH9TJEX
  language: German
  person:
   - name: Schubert, Dietrich   
     gender: m
     gender_provenece: inferred
  year: 1976.0
  quote: >
    Der Aktivismus ist eine Phase in der deutschen Literatur und Geistesgeschichte, eine anfangs schmale, später 
    sich verbreiternde geistige Bewegung, die Politik und Kultur nicht getrennt sehen will, sondern beide umfaßt, deren Ziel die 
    Gestaltung der Gemeinschaft, die Gestaltung des Lebens und der Gesellschaft ist. <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hillers</a> 
    Schlagwort wird »Tätiger Geist«. Die Bewegung entwickelt sich ganz im Sinne von <a href="https://www.wikidata.org/wiki/Q9358" target="_blank">Nietzsches</a> 
    Geschichtsverständnis dergestalt, daß Historie nur dann sinnvoll sei, wenn aus ihr der Impuls zur Lebensgestaltung komme. 
  bibliographical_info: 'p. 25'
- id: quote_92
  GND: 
   - 120093642
  WikiID:
   - Q2038672
  country: Germany
