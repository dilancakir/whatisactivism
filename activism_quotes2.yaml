  language: German
  person:
    - name: Bendel, Oliver
      gender: m
      gender_provenece: inferred
  year: 2021.0
  quote: >
    Ein Aktivist oder eine Aktivistin (engl. »activist«) setzt sich für ein soziales, ökologisches oder politisches Ziel wie Beendigung von Kriegshandlungen, 
    Eindämmung des Klimawandels und Abschaffung der Massentierhaltung oder der Überwachung ein, etwa mit Hilfe von Informationsbroschüren, Manifesten, 
    Petitionen und Demonstrationen sowie des Engagements in den sozialen Medien. Der Aktivismus kann individueller Art sein oder im Rahmen von Nichtregierungsorganisationen 
    (»non-governmental organizations«, NGOs) wie Amnesty International, Greenpeace oder Peta respektive von Bewegungen wie Fridays for Future (FFF) stattfinden. 
    Er kann sich auf fremde oder eigene (auch persönliche) Verhältnisse richten.
  bibliographical_info: '(last accessed 08.04.2025)'
- id: quote_81
  GND:
