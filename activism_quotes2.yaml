  year: 2021.0
  quote: >
    In  recent  decades,  digital  activism  has  received  a  lot  of  scholarly  and 
    journalistic attention. Even so, there remains no firm consensus on its precise 
    definition  and  scope.  
  bibliographical_info: 'p. 60'
