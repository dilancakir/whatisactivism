  quote: >
    I want to focus on <a href="https://www.wikidata.org/wiki/Q6279480" target="_blank">Medina’s</a> more recent concept of ‘epistemic activism’, understood, 
    as he puts it, as ‘subversive practices’ that ‘defy epistemic norms’ and seek 
    ‘to create epistemic friction with our sensibilities’ Public art, 
    <a href="https://www.wikidata.org/wiki/Q6279480" target="_blank">Medina</a> suggests, can be a powerful form of epistemic activism.
  bibliographical_info: "p. 3"
- id: quote_105
  GND:
    - 133905829
  WikiID:
    - Q95205841
  country: USA
  zotero_key: NAAEYUWZ
  language: English
  person:
    - name: Acosta López, María Del Rosario
      gender: f
      gender_provenece: inferred
  year: 2024.0
  quote: >
    In engaging with the work as ‘aesth-ethic activism’, I’ll suggest moving from 
    an emphasis on the ‘epistemic’ to an accent on sensibility, or even further, towards an interpretation of 
    the epistemic as grounded fundamentally on the aesthetic. [...] I want to ask what 
    form of ‘activism’ is performed by this work and what kind of ‘hermeneutical sensibilities’ are activated 
    by it. The work’s capacity to make us experience listening as something other, and perhaps anterior to, 
    signification, and its resistance to translate sound into ‘meaning’, will help me bring to light the power 
    of aesth-ethics to resist legibility as a criterion for organizing our acoustic experiences – even 
    (and perhaps more importantly) in the context of listening to testimony.
  bibliographical_info: "p. 3"
- id: quote_106
  GND:
    - 133905829
  WikiID:
    - Q95205841
  country: USA
  zotero_key: NAAEYUWZ
  language: English
  person:
    - name: Acosta López, María Del Rosario
      gender: f
      gender_provenece: inferred
  year: 2024.0
  quote: >
    If the task is not only to interrupt epistemic violence but to subvert the regimes of sense that make it possible  
    in the first place, then what is needed, beyond (or as part of) epistemic agency, is what Medina calls 
    ‘epistemic activism’: ‘subversive practices that defy epistemic norms and engage in contestations and 
    provocations that create epistemic friction with our sensibilities’. The goal, 
    as Medina has shown it recently in connection to protest – and to protesters as 
    ‘epistemic activists’ – is the development of ‘new political horizons and
    sensibilities’ and the ‘awakening of renewed and energized political imagination’.
  bibliographical_info: "p. 5"
- id: quote_107
  GND:
    - 133905829
  WikiID:
    - Q95205841
  country: USA
  zotero_key: NAAEYUWZ
  language: English
  person:
    - name: Acosta López, María Del Rosario
      gender: f
      gender_provenece: inferred
  year: 2024.0
  quote: >
    Epistemic activism is therefore fundamentally aesthetic activism. It is important not to think of 
    aesthetics here as replacing, substituting or even foregrounding the epistemic. I would rather insist on 
    understanding that <a href="https://www.wikidata.org/wiki/Q6279480" target="_blank">Medina’s</a> notion of the ‘epistemic’ comprises and emphasizes the role of aesthetics. When speaking of ‘aesth-ethic activism’, I first want to shift our attention to the particular 
    forms of activism that take place when subversive practices are specifically directed to disorganize our 
    senses, to destabilize the grammars that order our perception and to open/inaugurate sensible 
    regimes of sense.
  bibliographical_info: "p. 5-6"
- id: quote_108
  GND:
    - 133905829
  WikiID:
    - Q95205841
  country: USA
  zotero_key: NAAEYUWZ
  language: English
  person:
    - name: Acosta López, María Del Rosario
      gender: f
      gender_provenece: inferred
  year: 2024.0
  quote: >
    This is where <a href="https://www.wikidata.org/wiki/Q6279480" target="_blank">Medina</a> emphasizes art as epistemic activism. Art is paradigmatic in disturbing our 
    sensibilities in epistemically ‘productive’ ways precisely because it goes to the core of our ‘epistemic 
    sensibilities’. Artists as epistemic activists are here described by <a href="https://www.wikidata.org/wiki/Q6279480" target="_blank">Medina</a> as ‘guerrilla fighters for the 
    liberation of oppressed epistemic sensibilities and producers of epistemic friction between sensibilities’.
  bibliographical_info: "p. 6"
