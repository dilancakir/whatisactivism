  quote: >
    Aktivismus, Gegenströmung zum Expressionismus, die sich in den Jahrbüchern »Das Ziel« (1916-20) artikulierte, Literatur als Mittel zum Zweck verstand und sozialrevolutionäre, 
    pazifistische Ziele vertrat. Programmatische Bedeutung hatte <a href="https://www.wikidata.org/wiki/Q76480" target="_blank">Heinrich Manns</a> 
    Essay »Geist und Tat« (1910). Die führenden ›Aktivisten‹ waren <a href="https://www.wikidata.org/wiki/Q66458" target="_blank">Kurt Hiller</a> und 
    <a href="https://www.wikidata.org/wiki/Q1874926" target="_blank">Ludwig Rubiner</a>.
