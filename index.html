<div class="container">
    <div class="header">
        <h1>What is Activism?</h1>
        <p>A curated collection of quotes on activism from various historical and contemporary voices.</p>
        <p>Project by: <a href="https://dilancakir.github.io/" target="_blank">Dîlan Canan Çakir</a> | <a href="https://github.com/dilancakir/whatisactivism" target="_blank">Data Source</a></p>
    </div>
    <div class="filter-container">
        <input type="text" id="search" class="search-box" placeholder="🔍 Search for names or quotes" onkeyup="filterQuotes()">
        <select id="languageFilter" class="filters" onchange="filterQuotes()">
            <option value="">🌐 Select language</option>
        </select>
        <select id="countryFilter" class="filters" onchange="filterQuotes()">
            <option value="">🏳 Select country</option>
        </select>
        <select id="sortQuotes" class="sort-options" onchange="sortQuotes()">
            <option value="">🔀 Sort by</option>
            <option value="alphabet">A-Z</option>
            <option value="year">Year</option>
        </select>
    </div>
    <div id="quotes-container"></div>
</div>

<script>
    let quotesData = [];

    async function loadYAML() {
        const response = await fetch('https://raw.githubusercontent.com/dilancakir/whatisactivism/refs/heads/main/activism_quotes2.yaml');
        const text = await response.text();
        quotesData = jsyaml.load(text);
        populateFilters();
        displayQuotes(quotesData);
    }

    function populateFilters() {
        const languages = [...new Set(quotesData.map(q => q.language).filter(Boolean))];
        const countries = [...new Set(quotesData.map(q => q.country).filter(Boolean))];
        
        const langSelect = document.getElementById("languageFilter");
        languages.forEach(lang => langSelect.add(new Option(lang, lang)));
        
        const countrySelect = document.getElementById("countryFilter");
        countries.forEach(country => countrySelect.add(new Option(country, country)));
    }

    function sortQuotes() {
        const sortBy = document.getElementById("sortQuotes").value;
        if (sortBy === "alphabet") {
            quotesData.sort((a, b) => (a.person[0]?.name || "").localeCompare(b.person[0]?.name || ""));
        } else if (sortBy === "year") {
            quotesData.sort((a, b) => (a.year || 0) - (b.year || 0));
        }
        displayQuotes(quotesData);
    }

    async function fetchZoteroData(zoteroKey) {
        const groupID = "5261383"; // Zotero Gruppen-ID
        const response = await fetch(`https://api.zotero.org/groups/${groupID}/items/${zoteroKey}?format=json`);
        
        if (!response.ok) return "source unknown";

        const data = await response.json();

        if (data && data.data) {
            let person = data.data.creators?.[0]?.lastName || "person unknown";
            let title = data.data.title || "title unknown";
            let year = data.data.date?.substring(0, 4) || "year unknown";
            let place = data.data.place || "place unknown";

            return {
                text: `${person}: "${title}". ${place}, ${year}`,
                url: `https://www.zotero.org/groups/${groupID}/items/${zoteroKey}`
            };
        }

        return "source unknown";
    }

    function displayQuotes(data) {
        const container = document.getElementById("quotes-container");
        container.innerHTML = "";

        data.forEach(entry => {
            const card = document.createElement("div");
            card.className = "card";

            // Autor*innen formatieren und Gender anzeigen
            let authors = entry.person && entry.person.length 
                ? entry.person.map(p => `${p.name} (${p.gender || "unknown"})`).join(", ") 
                : "unknown";

            card.innerHTML = `
                <strong>${authors} (${entry.year || "unknown"})</strong>
                <em>"${entry.quote}"</em>
                <p>🌐 ${entry.language} | 🏳 ${entry.country || "unknown"}</p>
                <p>🧾 GND: <a href="https://d-nb.info/gnd/${entry.GND}" target="_blank">${entry.GND || "N/A"}</a></p>
                <p>⛓️ WikiData: <a href="https://www.wikidata.org/wiki/${entry.WikiID}" target="_blank">${entry.WikiID || "N/A"}</a></p>
                <p>📖 Bibliographical Info: ${entry.bibliographical_info || "N/A"}</p>
                <p> <img src="https://www.zotero.org/support/_media/logo/zotero_16x16x32.png" alt="Zotero Logo" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"> Zotero Source: <span id="zotero-link-${entry.id}">loading...</span></p>
            `;
            container.appendChild(card);

            // Zotero-Daten laden, falls vorhanden
            if (entry.zotero_key) {
                fetchZoteroData(entry.zotero_key).then(sourceInfo => {
                    if (sourceInfo !== "source unknown") {
                        document.getElementById(`zotero-link-${entry.id}`).innerHTML = `<a href="${sourceInfo.url}" target="_blank">${sourceInfo.text}</a>`;
                    } else {
                        document.getElementById(`zotero-link-${entry.id}`).innerText = sourceInfo;
                    }
                });
            }
        });
    }

    loadYAML();
</script>
