<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What is Activism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "IBM Plex Mono", monospace;
        background-color: #ffffff;
        color: #222;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: auto;
      }
      .header {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 2px solid #ccc;
      }
      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 5px;
      }
      .header p {
        font-size: 0.9rem;
        color: #666;
      }
      .filter-container {
        display: flex;
        gap: 10px;
        margin: 20px 0;
        align-items: center;
      }
      .search-box,
      .filters,
      .sort-options {
        padding: 8px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #f8f8f8;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
      }
      .search-box {
        flex: 2;
      }
      .filters,
      .sort-options {
        flex: 1;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 8px;
        margin: 10px 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        font-size: 0.7rem;
      }
      .card strong {
        display: block;
        font-weight: 600;
      }
      .card p {
        margin: 3px 0;
        line-height: 1.4;
      }
      .card a {
        text-decoration: none;
        color: #0077cc;
      }
      .button-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
        flex-wrap: wrap;
      }
      .button-row button {
        padding: 4px 5px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
      }
      .featured-quote {
        background: #fdf6e3;
        padding: 16px;
        border-left: 6px solid #d19f00;
        border-radius: 6px;
        margin: 30px auto 10px auto;
        max-width: 800px;
        font-size: 0.7rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .featured-quote p {
        margin: 4px 0;
      }
      .hidden {
        display: none;
      }

      @media (max-width: 600px) {
        .filter-container {
          flex-direction: column;
          align-items: stretch;
        }
        .search-box,
        .filters,
        .sort-options {
          width: 100%;
          flex: unset;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>What is Activism?</h1>
        <p>
          A curated collection of quotes on activism from various historical and
          contemporary voices.
        </p>
        <p>
          Project by:
          <a href="https://dilancakir.github.io/" target="_blank"
            >Dîlan Canan Çakir</a
          >
          |
          <a
            href="https://github.com/dilancakir/whatisactivism"
            target="_blank"
          >
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
              alt="GitHub"
              style="width: 16px; height: 16px; margin-right: 6px"
            />
            Data Source
          </a>
        </p>
      </div>

      <div class="filter-container">
        <input
          type="text"
          id="search"
          class="search-box"
          placeholder="🔍 search for names or quotes"
          onkeyup="filterQuotes()"
        />
        <select id="language" class="filters" onchange="filterQuotes()">
          <option value="">select language</option>
        </select>
        <select id="country" class="filters" onchange="filterQuotes()">
          <option value="">🏳 select country</option>
        </select>
        <select id="sortQuotes" class="sort-options" onchange="sortQuotes()">
          <option value="">sort by</option>
          <option value="year">year</option>
          <option value="alphabet">Person A-Z</option>
        </select>
      </div>

      <p
        id="quote-count"
        style="text-align: center; font-size: 0.9rem; color: #666"
      ></p>

      <div class="button-row">
        <button onclick="showRandomQuote()">show random quote</button>
        <button onclick="window.location.href = 'spectrum_engl.html'">
          spectrum of activism
        </button>
        <button onclick="window.location.href = 'statistics.html'">
          statistics to the data
        </button>
      </div>

      <div id="featured-quote" class="featured-quote hidden"></div>
      <div id="quotes-container"></div>
    </div>

    <script>
      var quotesData = [];
      var currentData = [];
      var zoteroTitles = {};
      var groupID = "5261383";

      function safeText(value, fallback = "N/A") {
        return value === undefined || value === null || value === ""
          ? fallback
          : value;
      }

      function makeSafeId(value) {
        return String(value || "")
          .replace(/[^a-zA-Z0-9_-]/g, "-")
          .replace(/-+/g, "-");
      }

      function extractZoteroKey(value) {
        if (!value) return "";

        var text = String(value).trim();

        var urlMatch = text.match(/\/items\/([A-Z0-9]{8})/i);
        if (urlMatch) return urlMatch[1].toUpperCase();

        var itemKeyMatch = text.match(/[?&]itemKey=([A-Z0-9]{8})/i);
        if (itemKeyMatch) return itemKeyMatch[1].toUpperCase();

        var keyMatch = text.match(/[A-Z0-9]{8}/i);
        if (keyMatch) return keyMatch[0].toUpperCase();

        return "";
      }

      function getUniqueId(entry, index, prefix) {
        var key = extractZoteroKey(entry.zotero_key);
        if (entry.id) return prefix + "-" + makeSafeId(entry.id) + "-" + index;
        if (key) return prefix + "-zotero-" + key + "-" + index;
        return prefix + "-index-" + index;
      }

      function chunkArray(array, size) {
        var chunks = [];
        for (var i = 0; i < array.length; i += size) {
          chunks.push(array.slice(i, i + size));
        }
        return chunks;
      }

      async function fetchZoteroItemsByKeys(keys) {
        var uniqueKeys = [...new Set(keys.filter(Boolean))];
        var chunks = chunkArray(uniqueKeys, 50);
        var allItems = [];

        for (var chunk of chunks) {
          var url =
            "https://api.zotero.org/groups/" +
            groupID +
            "/items?itemKey=" +
            chunk.join(",") +
            "&format=json&include=data";

          var response = await fetch(url, {
            headers: {
              "Zotero-API-Version": "3",
            },
          });

          if (!response.ok) {
            console.warn("Zotero batch failed:", response.status, chunk);
            continue;
          }

          var items = await response.json();
          allItems = allItems.concat(items);
        }

        return allItems;
      }

      async function loadZoteroTitlesForData(data) {
        var originalKeys = data
          .map((entry) => extractZoteroKey(entry.zotero_key))
          .filter(Boolean);

        var items = await fetchZoteroItemsByKeys(originalKeys);

        var parentKeys = [];

        items.forEach((item) => {
          var key = item?.data?.key;
          var title =
            item?.data?.title ||
            item?.data?.bookTitle ||
            item?.data?.publicationTitle ||
            item?.data?.shortTitle ||
            "";

          if (key && title) {
            zoteroTitles[key] = {
              title: title,
              key: key,
            };
          }

          if (
            item?.data?.parentItem &&
            (item?.data?.itemType === "attachment" ||
              item?.data?.itemType === "note" ||
              item?.data?.itemType === "annotation")
          ) {
            parentKeys.push(item.data.parentItem);
          }
        });

        if (parentKeys.length) {
          var parentItems = await fetchZoteroItemsByKeys(parentKeys);

          parentItems.forEach((parentItem) => {
            var parentKey = parentItem?.data?.key;
            var parentTitle =
              parentItem?.data?.title ||
              parentItem?.data?.bookTitle ||
              parentItem?.data?.publicationTitle ||
              parentItem?.data?.shortTitle ||
              "";

            if (!parentKey || !parentTitle) return;

            items.forEach((childItem) => {
              if (childItem?.data?.parentItem === parentKey) {
                var childKey = childItem?.data?.key;
                if (childKey) {
                  zoteroTitles[childKey] = {
                    title: parentTitle,
                    key: parentKey,
                  };
                }
              }
            });

            zoteroTitles[parentKey] = {
              title: parentTitle,
              key: parentKey,
            };
          });
        }

        updateVisibleZoteroLinks();
      }

      function updateVisibleZoteroLinks() {
        document.querySelectorAll("[data-zotero-key]").forEach((span) => {
          var originalKey = span.getAttribute("data-zotero-key");
          var cleanKey = extractZoteroKey(originalKey);

          if (!cleanKey) {
            span.textContent = "No Zotero key";
            return;
          }

          var info = zoteroTitles[cleanKey];

          if (!info || !info.title) {
            span.textContent = "Zotero title not found";
            return;
          }

          var link =
            "https://www.zotero.org/groups/" + groupID + "/items/" + info.key;

          span.innerHTML =
            '<a href="' + link + '" target="_blank">' + info.title + "</a>";
        });
      }

      function loadYAML() {
        fetch("activism_quotes2.yaml")
          .then((r) => r.text())
          .then((text) => {
            quotesData = jsyaml.load(text) || [];
            currentData = quotesData.slice();

            populateFilters();
            displayQuotes(currentData);

            document.getElementById("quote-count").textContent =
              "Database currently contains " + quotesData.length + " quotes.";

            loadZoteroTitlesForData(quotesData);
          })
          .catch((err) => console.log("Error loading YAML file:", err));
      }

      function populateFilters() {
        var languageSelect = document.getElementById("language");
        var countrySelect = document.getElementById("country");

        languageSelect.innerHTML = '<option value="">select language</option>';
        countrySelect.innerHTML = '<option value="">🏳 select country</option>';

        var languages = [
          ...new Set(
            quotesData
              .map((q) => String(q.language || "").trim())
              .filter(Boolean),
          ),
        ].sort();

        var countries = [
          ...new Set(
            quotesData
              .map((q) => String(q.country || "").trim())
              .filter(Boolean),
          ),
        ].sort();

        languages.forEach((l) => {
          var option = document.createElement("option");
          option.value = l;
          option.textContent = l;
          languageSelect.appendChild(option);
        });

        countries.forEach((c) => {
          var option = document.createElement("option");
          option.value = c;
          option.textContent = c;
          countrySelect.appendChild(option);
        });
      }

      function filterQuotes() {
        var search = document
          .getElementById("search")
          .value.toLowerCase()
          .trim();

        var lang = document.getElementById("language").value.trim();
        var country = document.getElementById("country").value.trim();

        currentData = quotesData.filter((entry) => {
          var quote = String(entry.quote || "").toLowerCase();
          var bibliographical = String(
            entry.bibliographical_info || "",
          ).toLowerCase();

          var matchText =
            search === "" ||
            quote.includes(search) ||
            bibliographical.includes(search);

          if (entry.person && Array.isArray(entry.person)) {
            entry.person.forEach((p) => {
              var name = String(p.name || "").toLowerCase();

              var parts = name.split(",");
              var flipped =
                parts.length === 2
                  ? parts[1].trim() + " " + parts[0].trim()
                  : name;

              if (name.includes(search) || flipped.includes(search)) {
                matchText = true;
              }
            });
          }

          var entryLanguage = String(entry.language || "").trim();
          var entryCountry = String(entry.country || "").trim();

          var matchLang = lang === "" || entryLanguage === lang;
          var matchCountry = country === "" || entryCountry === country;

          return matchText && matchLang && matchCountry;
        });

        applySorting();
        displayQuotes(currentData);
        updateVisibleZoteroLinks();
      }

      function sortQuotes() {
        applySorting();
        displayQuotes(currentData);
        updateVisibleZoteroLinks();
      }

      function applySorting() {
        var sortBy = document.getElementById("sortQuotes").value;

        if (sortBy === "alphabet") {
          currentData.sort((a, b) => {
            var A = a.person?.[0]?.name || "";
            var B = b.person?.[0]?.name || "";
            return A.localeCompare(B);
          });
        }

        if (sortBy === "year") {
          currentData.sort((a, b) => {
            var yearA = a.year || 999999;
            var yearB = b.year || 999999;
            return yearA - yearB;
          });
        }
      }

      function renderQuoteHTML(entry, isFeatured, uniqueId) {
        var authors = "unknown";

        if (
          entry.person &&
          Array.isArray(entry.person) &&
          entry.person.length
        ) {
          authors = entry.person
            .map(
              (p) =>
                `${safeText(p.name, "unknown")} (${safeText(p.gender, "?")})`,
            )
            .join(", ");
        }

        var gndHTML = entry.GND
          ? `<a href="https://d-nb.info/gnd/${entry.GND}" target="_blank">${entry.GND}</a>`
          : "N/A";

        var wdHTML = entry.WikiID
          ? `<a href="https://www.wikidata.org/wiki/${entry.WikiID}" target="_blank">${entry.WikiID}</a>`
          : "N/A";

        var zoteroKey = extractZoteroKey(entry.zotero_key);

        var zoteroHTML = zoteroKey
          ? `<span id="zotero-link-${uniqueId}" data-zotero-key="${zoteroKey}">loading...</span>`
          : `<span>No Zotero key</span>`;

        var headline = isFeatured
          ? `<h3 style="margin-top:0;color:#d19f00;font-size:0.7rem;">random quote</h3>`
          : "";

        return `
        ${headline}
        <strong>${authors} (${safeText(entry.year, "unknown")})</strong>
        <em style="font-size: 0.85rem;">“${safeText(entry.quote, "")}”</em>
        <p>🌐 ${safeText(entry.language, "unknown")} | 🏳 ${safeText(entry.country, "unknown")}</p>
        <p>🧾 GND: ${gndHTML}</p>
        <p>
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Wikidata-logo.svg" style="width:16px;height:16px;vertical-align:middle;margin-right:5px;">
          WikiData: ${wdHTML}
        </p>
        <p>📖 Bibliographical Info: ${safeText(entry.bibliographical_info, "N/A")}</p>
        <p>
          <img src="https://www.zotero.org/support/_media/logo/zotero_16x16x32.png" style="width:16px;height:16px;vertical-align:middle;margin-right:5px;">
          Zotero Source: ${zoteroHTML}
        </p>
      `;
      }

      function displayQuotes(data) {
        var container = document.getElementById("quotes-container");
        container.innerHTML = "";

        data.forEach((entry, index) => {
          var uniqueId = getUniqueId(entry, index, "card");

          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML = renderQuoteHTML(entry, false, uniqueId);

          container.appendChild(card);
        });
      }

      function showRandomQuote() {
        if (!quotesData.length) return;

        var randomIndex = Math.floor(Math.random() * quotesData.length);
        var entry = quotesData[randomIndex];
        var uniqueId = getUniqueId(entry, randomIndex, "random");

        var box = document.getElementById("featured-quote");
        box.innerHTML = renderQuoteHTML(entry, true, uniqueId);
        box.classList.remove("hidden");

        updateVisibleZoteroLinks();
      }

      loadYAML();
    </script>
  </body>
</html>
