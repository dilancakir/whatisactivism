<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Activism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .project-info {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .filters, .search-box {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card strong {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="project-info">
            <h2>Activism Quote Collection</h2>
            <p>A curated collection of quotes on activism from various historical and contemporary voices.</p>
        </div>
        <input type="text" id="search" class="search-box" placeholder="🔍 Search for names or quotes" onkeyup="filterQuotes()">
        <select id="languageFilter" class="filters" onchange="filterQuotes()">
            <option value="">🌍 Select language</option>
        </select>
        <select id="countryFilter" class="filters" onchange="filterQuotes()">
            <option value="">🏳 Select country</option>
        </select>
        <div id="quotes-container"></div>
    </div>

    <script>
        let quotesData = [];

        async function loadYAML() {
            const response = await fetch('https://raw.githubusercontent.com/dilancakir/whatisactivism/refs/heads/main/activism_quotes2.yaml');
            const text = await response.text();
            quotesData = jsyaml.load(text);
            populateFilters();
            displayQuotes(quotesData);
        }

        function populateFilters() {
            const languages = [...new Set(quotesData.map(q => q.language).filter(Boolean))];
            const countries = [...new Set(quotesData.map(q => q.country).filter(Boolean))];
            
            const langSelect = document.getElementById("languageFilter");
            languages.forEach(lang => langSelect.add(new Option(lang, lang)));
            
            const countrySelect = document.getElementById("countryFilter");
            countries.forEach(country => countrySelect.add(new Option(country, country)));
        }

        function displayQuotes(data) {
            const container = document.getElementById("quotes-container");
            container.innerHTML = "";

            data.forEach(entry => {
                const card = document.createElement("div");
                card.className = "card";
                let authors = entry.person && entry.person.length 
                    ? entry.person.map(p => `${p.name} (${p.gender || "unknown"})`).join(", ") 
                    : "unknown";
                
                card.innerHTML = `
                    <strong>${authors} (${entry.year || "unknown"})</strong>
                    <em>"${entry.quote}"</em>
                    <p>🌍 ${entry.language} | 🏳 ${entry.country || "unknown"}</p>
                `;
                container.appendChild(card);
            });
        }

        function filterQuotes() {
            let search = document.getElementById("search").value.toLowerCase();
            let langFilter = document.getElementById("languageFilter").value;
            let countryFilter = document.getElementById("countryFilter").value;

            let filteredData = quotesData.filter(entry =>
                (entry.person.some(p => p.name.toLowerCase().includes(search)) || entry.quote.toLowerCase().includes(search)) &&
                (langFilter === "" || entry.language === langFilter) &&
                (countryFilter === "" || entry.country === countryFilter)
            );

            displayQuotes(filteredData);
        }

        loadYAML();
    </script>
</body>
</html>
