<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What is Activism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .search-box { margin-bottom: 10px; }
        .filters { margin-bottom: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; background: #f9f9f9; }
        .card strong { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>What is Activism</h1>
    
    <input type="text" id="search" class="search-box" placeholder="🔍 Search for names or quotes" onkeyup="filterQuotes()">
    
    <select id="languageFilter" class="filters" onchange="filterQuotes()">
        <option value="">🌍 Select language</option>
    </select>
    
    <select id="countryFilter" class="filters" onchange="filterQuotes()">
        <option value="">🏳 Select country</option>
    </select>
    
    <div id="quotes-container"></div>

    <script>
        let quotesData = [];

        async function loadYAML() {
            const response = await fetch('https://raw.githubusercontent.com/dilancakir/whatisactivism/refs/heads/main/activism_quotes2.yaml');
            const text = await response.text();
            quotesData = jsyaml.load(text);
            populateFilters();
            displayQuotes(quotesData);
        }

        function populateFilters() {
            const languages = [...new Set(quotesData.map(q => q.language).filter(Boolean))];
            const countries = [...new Set(quotesData.map(q => q.country).filter(Boolean))];

            const langSelect = document.getElementById("languageFilter");
            languages.forEach(lang => {
                let option = new Option(lang, lang);
                langSelect.add(option);
            });

            const countrySelect = document.getElementById("countryFilter");
            countries.forEach(country => {
                let option = new Option(country, country);
                countrySelect.add(option);
            });
        }

        async function fetchZoteroData(zoteroKey) {
            const groupID = "5261383"; // Zotero Gruppen-ID
            const response = await fetch(`https://api.zotero.org/groups/${groupID}/items/${zoteroKey}?format=json`);
            
            if (!response.ok) return "Quelle nicht gefunden";

            const data = await response.json();

            if (data && data.data) {
                let author = data.data.creators?.[0]?.lastName || "Unbekannter Autor";
                let title = data.data.title || "Unbekannter Titel";
                let year = data.data.date?.substring(0, 4) || "Unbekanntes Jahr";
                let place = data.data.place || "Unbekannter Ort";

                return `${author}: "${title}". ${place}, ${year}`;
            }

            return "Quelle nicht gefunden";
        }

        function displayQuotes(data) {
            const container = document.getElementById("quotes-container");
            container.innerHTML = "";

            data.forEach(entry => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <strong>${entry.name} (${entry.year || "unknown"})</strong>
                    <em>"${entry.quote}"</em>
                    <p>🌍 ${entry.language} | 🏳 ${entry.country || "unknown"}</p>
                    <p>🚻 Gender: ${entry.gender || "unknown"}</p>
                    <p>🔗 GND: <a href="https://d-nb.info/gnd/${entry.GND}" target="_blank">${entry.GND || "N/A"}</a></p>
                    <p>🌐 WikiData: <a href="https://www.wikidata.org/wiki/${entry.WikiID}" target="_blank">${entry.WikiID || "N/A"}</a></p>
                    <p>📖 Source: <span id="source-${entry.id}">Lädt...</span></p>
                `;
                container.appendChild(card);

                // Zotero-Daten laden, falls vorhanden
                if (entry.zotero_key) {
                    fetchZoteroData(entry.zotero_key).then(sourceInfo => {
                        document.getElementById(`source-${entry.id}`).innerText = sourceInfo;
                    });
                }
            });
        }

        function filterQuotes() {
            let search = document.getElementById("search").value.toLowerCase();
            let langFilter = document.getElementById("languageFilter").value;
            let countryFilter = document.getElementById("countryFilter").value;

            let filteredData = quotesData.filter(entry =>
                (entry.name.toLowerCase().includes(search) || entry.quote.toLowerCase().includes(search)) &&
                (langFilter === "" || entry.language === langFilter) &&
                (countryFilter === "" || entry.country === countryFilter)
            );

            displayQuotes(filteredData);
        }

        loadYAML();
    </script>
</body>
</html>
