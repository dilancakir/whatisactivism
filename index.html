<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What is Activism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "IBM Plex Mono", monospace;
        background-color: #ffffff;
        color: #222;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: auto;
      }
      .header {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 2px solid #ccc;
      }
      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 5px;
      }
      .header p {
        font-size: 0.9rem;
        color: #666;
      }
      .filter-container {
        display: flex;
        gap: 10px;
        margin: 20px 0;
        align-items: center;
      }
      .search-box,
      .filters,
      .sort-options {
        padding: 8px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: #f8f8f8;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
      }
      .search-box {
        flex: 2;
      }
      .filters,
      .sort-options {
        flex: 1;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 8px;
        margin: 10px 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        font-size: 0.7rem;
      }
      .card strong {
        display: block;
        font-weight: 600;
      }
      .card p {
        margin: 3px 0;
        line-height: 1.4;
      }
      .card a {
        text-decoration: none;
        color: #0077cc;
      }
      .button-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
        flex-wrap: wrap;
      }
      .button-row button {
        padding: 4px 5px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
      }
      .featured-quote {
        background: #fdf6e3;
        padding: 16px;
        border-left: 6px solid #d19f00;
        border-radius: 6px;
        margin: 30px auto 10px auto;
        max-width: 800px;
        font-size: 0.7rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .featured-quote p {
        margin: 4px 0;
      }
      .hidden {
        display: none;
      }

      /* 📱 Mobile layout fix */
      @media (max-width: 600px) {
        .filter-container {
          flex-direction: column;
          align-items: stretch;
        }
        .search-box,
        .filters,
        .sort-options {
          width: 100%;
          flex: unset;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>What is Activism?</h1>
        <p>
          A curated collection of quotes on activism from various historical and
          contemporary voices.
        </p>
        <p>
          Project by:
          <a href="https://dilancakir.github.io/" target="_blank"
            >Dîlan Canan Çakir</a
          >
          |
          <a
            href="https://github.com/dilancakir/whatisactivism"
            target="_blank"
          >
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
              alt="GitHub"
              style="width: 16px; height: 16px; margin-right: 6px"
            />
            Data Source
          </a>
        </p>
      </div>

      <div class="filter-container">
        <input
          type="text"
          id="search"
          class="search-box"
          placeholder="🔍 search for names or quotes"
          onkeyup="filterQuotes()"
        />
        <select id="language" class="filters" onchange="filterQuotes()">
          <option value="">select language</option>
        </select>
        <select id="country" class="filters" onchange="filterQuotes()">
          <option value="">🏳 select country</option>
        </select>
        <select id="sortQuotes" class="sort-options" onchange="sortQuotes()">
          <option value="">sort by</option>
          <option value="year">year</option>
          <option value="alphabet">Person A-Z</option>
        </select>
      </div>

      <p
        id="quote-count"
        style="text-align: center; font-size: 0.9rem; color: #666"
      ></p>

      <div class="button-row">
        <button onclick="showRandomQuote()">show random quote</button>
        <button onclick="window.location.href='spectrum_engl.html'">
          spectrum of activism
        </button>
        <button onclick="window.location.href='statistics.html'">
          statistics to the data
        </button>
      </div>

      <div id="featured-quote" class="featured-quote hidden"></div>
      <div id="quotes-container"></div>
    </div>

    <script>
      var quotesData = [];

      function loadYAML() {
        fetch("activism_quotes2.yaml")
          .then((r) => r.text())
          .then((text) => {
            quotesData = jsyaml.load(text) || [];
            populateFilters();
            displayQuotes(quotesData);
            document.getElementById("quote-count").textContent =
              "Database currently contains " + quotesData.length + " quotes.";
          })
          .catch((err) => console.log("Error loading YAML file:", err));
      }

      function populateFilters() {
        var languageSelect = document.getElementById("language");
        var countrySelect = document.getElementById("country");

        var languages = [
          ...new Set(quotesData.map((q) => q.language).filter(Boolean)),
        ];
        var countries = [
          ...new Set(quotesData.map((q) => q.country).filter(Boolean)),
        ];

        languages.forEach(
          (l) =>
            (languageSelect.innerHTML += `<option value="${l}">${l}</option>`)
        );
        countries.forEach(
          (c) =>
            (countrySelect.innerHTML += `<option value="${c}">${c}</option>`)
        );
      }

      /* ------------------------------
   FIXED SEARCH FUNCTION
--------------------------------*/
      function filterQuotes() {
        var search = document.getElementById("search").value.toLowerCase();
        var lang = document.getElementById("language").value;
        var country = document.getElementById("country").value;

        var result = [];

        for (var entry of quotesData) {
          var matchText = entry.quote.toLowerCase().includes(search);

          if (entry.person) {
            for (var p of entry.person) {
              var name = p.name.toLowerCase();

              // "Nachname, Vorname" → "Vorname Nachname"
              var parts = name.split(",");
              var flipped =
                parts.length === 2
                  ? parts[1].trim() + " " + parts[0].trim()
                  : name;

              if (name.includes(search) || flipped.includes(search)) {
                matchText = true;
              }
            }
          }

          var matchLang = lang ? entry.language === lang : true;
          var matchCountry = country ? entry.country === country : true;

          if (matchText && matchLang && matchCountry) {
            result.push(entry);
          }
        }

        displayQuotes(result);
      }

      function sortQuotes() {
        var sortBy = document.getElementById("sortQuotes").value;
        var sorted = quotesData.slice();

        if (sortBy === "alphabet") {
          sorted.sort((a, b) => {
            var A = a.person?.[0]?.name || "";
            var B = b.person?.[0]?.name || "";
            return A.localeCompare(B);
          });
        }

        if (sortBy === "year") {
          sorted.sort((a, b) => (a.year || 0) - (b.year || 0));
        }

        displayQuotes(sorted);
      }

      function displayQuotes(data) {
        var container = document.getElementById("quotes-container");
        container.innerHTML = "";

        data.forEach((entry) => {
          var card = document.createElement("div");
          card.className = "card";

          var authors = "unknown";
          if (entry.person?.length) {
            authors = entry.person
              .map((p) => `${p.name} (${p.gender || "?"})`)
              .join(", ");
          }

          var gndHTML = entry.GND
            ? `<a href='https://d-nb.info/gnd/${entry.GND}' target='_blank'>${entry.GND}</a>`
            : "N/A";

          var wdHTML = entry.WikiID
            ? `<a href='https://www.wikidata.org/wiki/${entry.WikiID}' target='_blank'>${entry.WikiID}</a>`
            : "N/A";

          card.innerHTML = `
      <strong>${authors} (${entry.year || "unknown"})</strong>
      <em style='font-size: 0.85rem;'>“${entry.quote}”</em>
      <p>🌐 ${entry.language} | 🏳 ${entry.country || "unknown"}</p>
      <p>🧾 GND: ${gndHTML}</p>
      <p><img src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Wikidata-logo.svg/30px-Wikidata-logo.svg.png' style='width:16px;height:16px;vertical-align:middle;margin-right:5px;'> WikiData: ${wdHTML}</p>
      <p>📖 Bibliographical Info: ${entry.bibliographical_info || "N/A"}</p>
      <p><img src='https://www.zotero.org/support/_media/logo/zotero_16x16x32.png' style='width:16px;height:16px;vertical-align:middle;margin-right:5px;'> 
         Zotero Source: <span id='zotero-link-${entry.id}'>loading...</span>
      </p>
    `;

          container.appendChild(card);

          if (entry.zotero_key) fetchZoteroData(entry.id, entry.zotero_key);
        });
      }

      function fetchZoteroData(entryId, zoteroKey) {
        var groupID = "5261383";
        fetch(
          `https://api.zotero.org/groups/${groupID}/items/${zoteroKey}?format=json`
        )
          .then((r) => r.json())
          .then((data) => {
            var title = data.data.title || "Zotero Item";
            var link = `https://www.zotero.org/groups/${groupID}/items/${zoteroKey}`;
            document.getElementById(
              `zotero-link-${entryId}`
            ).innerHTML = `<a href="${link}" target="_blank">${title}</a>`;
          })
          .catch(() => {
            document.getElementById(`zotero-link-${entryId}`).textContent =
              "Zotero Item";
          });
      }

      function showRandomQuote() {
        var entry = quotesData[Math.floor(Math.random() * quotesData.length)];

        var authors = entry.person
          ? entry.person.map((p) => `${p.name} (${p.gender || "?"})`).join(", ")
          : "Unknown";

        var quoteHTML = `
    <h3 style='margin-top:0;color:#d19f00;font-size:0.7rem;'>random quote</h3>
    <strong>${authors} (${entry.year || "?"})</strong><br>
    <em>“${entry.quote}”</em>
    <p>🌐 ${entry.language} | 🏳 ${entry.country || "?"}</p>
  `;

        var box = document.getElementById("featured-quote");
        box.innerHTML = quoteHTML;
        box.classList.remove("hidden");
      }

      loadYAML();
    </script>
  </body>
</html>
